<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DECIVEXA — Prototype V1 Refinement 03</title>
<style>
:root{--bg:#f7f6f3;--surface:#fff;--surface2:#f0eee9;--text:#17161a;--muted:#69666f;--border:#ddd9d2;--brand:#7464de;--brand2:#5d4bc8;--ok:#287a58;--warn:#9a6b16;--danger:#a33b45;--r:16px}*{box-sizing:border-box}html{scroll-padding-bottom:100px}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.sidebar{background:#fff;border-inline-end:1px solid var(--border);padding:24px 16px;position:sticky;top:0;height:100vh}.logo{font-weight:800;font-size:22px;padding:8px 12px 28px}.nav{display:grid;gap:6px}.nav button,.utility button{border:0;background:transparent;text-align:start;padding:11px 12px;border-radius:12px;color:var(--muted)}.nav button.active{background:#eeeafd;color:var(--brand2);font-weight:700}.utility{position:absolute;bottom:18px;left:16px;right:16px}.main{max-width:1180px;width:100%;margin:auto;padding:34px 34px 100px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:28px}.eyebrow{color:var(--muted);font-size:13px}.title{font-size:32px;line-height:1.25;margin:4px 0}.crumb{font-size:13px;color:var(--muted);margin-bottom:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--border);background:var(--surface);padding:9px 14px;border-radius:11px}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.danger{color:var(--danger)}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{grid-column:span 12;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px}.half{grid-column:span 6}.label{font-size:12px;color:var(--muted);margin-bottom:5px}.big{font-size:21px;font-weight:750}.muted{color:var(--muted)}.status{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:999px;padding:3px 9px;font-size:12px}.inferred{color:#5b48b9;background:#f0edff}.confirmed{color:var(--ok);background:#edf8f2}.stale{color:var(--warn);background:#fff7e6}.proposed{color:#5b48b9;background:#f0edff}.failed{color:var(--danger);background:#fff0f1}.questioned{color:var(--warn);background:#fff7e6}.row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.stack{display:grid;gap:10px}.notice{padding:13px 15px;border-radius:12px;background:var(--surface2);border:1px solid var(--border)}.notice.warn{background:#fff8e9}.notice.error{background:#fff1f2}.notice.ok{background:#edf8f2}.timeline{border-inline-start:2px solid var(--border);padding-inline-start:18px}.step{margin:0 0 16px}.option{border:1px solid var(--border);padding:13px;border-radius:12px;text-align:start;background:#fff;width:100%}.option.selected{border-color:var(--brand);background:#f1efff}.search{width:min(520px,100%);padding:10px 13px;border:1px solid var(--border);border-radius:12px;background:#fff}.focus:focus-visible,.btn:focus-visible,.nav button:focus-visible,.option:focus-visible,.search:focus-visible{outline:3px solid #8f84ef;outline-offset:3px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.modal{position:fixed;inset:0;background:rgba(10,9,14,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.dialog{max-width:640px;width:100%;max-height:90vh;overflow:auto;background:var(--surface);border-radius:20px;padding:24px;box-shadow:0 24px 80px rgba(0,0,0,.2)}.dialog h2{margin-top:0}.footerbar{margin-top:18px;display:flex;justify-content:space-between;gap:10px}.mobile-nav{display:none}@media(max-width:900px){.app{grid-template-columns:76px 1fr}.sidebar{padding:16px 8px}.logo{font-size:18px;text-align:center}.nav button{font-size:0;text-align:center}.nav button::first-letter{font-size:18px}.utility button{font-size:0}.main{padding:24px 18px 100px}.half{grid-column:span 12}.title{font-size:28px}}@media(max-width:620px){.app{display:block}.sidebar{display:none}.mobile-nav{display:grid;position:fixed;bottom:0;left:0;right:0;grid-template-columns:repeat(5,1fr);z-index:10;padding:7px;background:#fff;border-top:1px solid var(--border)}.mobile-nav button{border:0;background:transparent;padding:8px 2px;font-size:11px}.main{padding:20px 14px 96px}.top{align-items:flex-start;flex-direction:column}.grid{gap:12px}.card{padding:16px}.dialog{padding:19px;max-height:88vh}.row{align-items:flex-start}.actions{width:100%}.actions .btn{flex:1}}
</style></head>
<body>
<div class="app"><aside class="sidebar" aria-label="Primary navigation"><div class="logo">DECIVEXA</div><nav id="nav" class="nav"><button data-view="home">⌂ <span>خانه</span></button><button data-view="today">◷ <span>امروز</span></button><button data-view="goals">◎ <span>اهداف</span></button><button data-view="understand">◌ <span>درک</span></button><button data-view="decisions">◇ <span>تصمیم‌ها</span></button></nav><div class="utility"><button data-view="search">⌕ جستجو</button><button id="lang">English / فارسی</button></div></aside><main id="main" class="main" tabindex="-1"></main></div>
<nav id="mobileNav" class="mobile-nav" aria-label="Primary navigation"></nav>
<div id="modal" class="modal" role="presentation"><div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1"><div id="dialogBody"></div></div></div><div id="status" class="sr" role="status" aria-live="polite"></div>
<script>
const S={view:'home',lang:'fa',proposal:'PROPOSED',correction:'CURRENT',decision:null,actionOutcome:null,error:'IDLE',search:'',context:[]};
const labels={home:['⌂','خانه','Home'],today:['◷','امروز','Today'],goals:['◎','اهداف','Goals'],understand:['◌','درک','Understand'],decisions:['◇','تصمیم‌ها','Decisions']};
function t(a,b){return S.lang==='fa'?a:b}function announce(x){document.getElementById('status').textContent=x}
function pushContext(v){if(S.context[S.context.length-1]!==v)S.context.push(v)}
function setView(v){pushContext(v);S.view=v;render();window.scrollTo(0,0);document.getElementById('main').focus()}
function backContext(){if(S.context.length>1){S.context.pop();S.view=S.context[S.context.length-1];render();window.scrollTo(0,0);document.getElementById('main').focus()}else setView('home')}
function shell(title,eyebrow,body,actions=''){return `<div class="crumb">${S.context.slice(0,-1).map((x,i)=>`${i?' / ':''}${x}`).join('')}</div><div class="top"><div><div class="eyebrow">${eyebrow}</div><h1 class="title">${title}</h1></div><div class="actions">${actions}</div></div>${body}`}
function home(){return shell(t('جایی که هستی، قبل از اینکه بگویی چه کاری انجام بدهی.','Where you are, before what you should do next.'),t('جهت امروز','TODAY’S ORIENTATION'),`<div class="grid"><section class="card"><div class="label">${t('تمرکز اصلی','PRIMARY FOCUS')}</div><div class="big">${t('آماده‌سازی برای مهاجرت حرفه‌ای','Prepare for a professional transition')}</div><p class="muted">${t('چرا حالا؟ ظرفیت زمانی این هفته تغییر کرده و این هدف به تصمیم فعلی مرتبط است.','Why now? Capacity changed and this goal is connected to a current decision.')}</p><button class="btn primary" onclick="setView('goaldetail')">${t('مشاهده هدف','Open goal')}</button></section><section class="card half"><div class="label">${t('تغییر معنادار','MEANINGFUL CHANGE')}</div><div class="big">${t('ظرفیت امروز کمتر شده','Today’s capacity is lower')}</div><p class="muted">${t('پیشنهاد سازگاری هنوز اعمال نشده است.','An adaptation proposal has not been applied.')}</p></section><section class="card half"><div class="label">${t('قدم بعدی','NEXT')}</div><div class="big">${t('بررسی مسیر هدف','Review the goal path')}</div><p class="muted">${t('پیشنهاد جایگزین در وضعیت فعلی قابل بررسی است.','An alternative proposal is available for review.')}</p></section></div>`)}
function today(){return shell(t('امروز','Today'),t('عملیات روزانه','DAILY OPERATING SURFACE'),`<div class="grid"><section class="card"><div class="label">${t('جهت امروز','TODAY’S DIRECTION')}</div><div class="big">${t('یک گام معنادار، نه فهرست بلند کارها','One meaningful step, not a long task list')}</div></section><section class="card half"><div class="label">${t('اقدام اولویت‌دار','PRIORITY ACTION')}</div><div class="big">${t('ارسال مدارک برای بررسی','Send documents for review')}</div><p class="muted">${t('هدف: آماده‌سازی مسیر مهاجرت حرفه‌ای','Goal: prepare professional transition')}</p><button class="btn primary" onclick="actionModal()">${t('باز کردن اقدام','Open action')}</button></section><section class="card half"><div class="label">${t('ظرفیت','CAPACITY')}</div><div class="big">${t('متوسط رو به پایین','Moderate → low')}</div></section><section class="card"><div class="label">${t('تغییرات امروز','CHANGES')}</div><div class="row"><span>${t('یک اقدام مسدود شده','One action is blocked')}</span><button class="btn" onclick="adaptModal()">${t('بررسی سازگاری','Review adaptation')}</button></div>${S.proposal!=='PROPOSED'?`<div class="row"><span>${t('وضعیت پیشنهاد','Proposal state')}</span><span class="status ${S.proposal==='FAILED-INCOMPLETE'?'failed':S.proposal==='APPLIED'?'confirmed':'proposed'}">${S.proposal}</span></div>`:''}</section></div>`)}
function goals(){return shell(t('اهداف','Goals'),t('جهت و مسیر','DIRECTION & PATH'),`<div class="grid"><section class="card"><div class="label">ACTIVE GOAL</div><div class="big">${t('آماده‌سازی برای مهاجرت حرفه‌ای','Prepare for a professional transition')}</div><p>${t('مسیر فعلی نیاز به بازبینی دارد.','Current path needs review.')}</p><button class="btn primary" onclick="setView('goaldetail')">${t('ورود به فضای هدف','Open goal workspace')}</button></section></div>`)}
function goaldetail(){return shell(t('آماده‌سازی برای مهاجرت حرفه‌ای','Prepare for a professional transition'),t('هدف / فضای کاری','GOAL WORKSPACE'),`<div class="grid"><section class="card half"><div class="label">${t('وضعیت فعلی','CURRENT STATE')}</div><div class="big">${t('مسیر موجود، اما ظرفیت محدود','Path exists, capacity is constrained')}</div><p class="muted">${t('این وضعیت تفسیر است، نه واقعیت خام.','This is an interpretation, not raw reality.')}</p></section><section class="card half"><div class="label">${t('آمادگی هدف','READINESS')}</div><div class="big">${t('یک وابستگی حل‌نشده','One dependency unresolved')}</div></section><section class="card"><div class="label">${t('شواهد مرتبط','EVIDENCE')}</div><div class="row"><span>${t('ثبت تغییر ظرفیت زمانی','Recorded change in time capacity')}</span><span class="status confirmed">RECORDED</span></div><div class="row"><span>${t('تفسیر مسیر فعلی','Interpretation of current path')}</span><span class="status inferred">INFERRED</span></div><button class="btn" onclick="setView('evidence')">${t('مشاهده شواهد','View evidence')}</button></section><section class="card"><div class="label">${t('مسیر پیشنهادی','PROPOSED PATH')}</div><div class="notice">${t('پیشنهاد تغییری در برنامه ایجاد نکرده است.','The proposal has not changed the plan.')}</div><div class="row"><span>${t('وضعیت','State')}</span><span class="status ${S.proposal==='PROPOSED'?'proposed':S.proposal==='FAILED-INCOMPLETE'?'failed':'confirmed'}">${S.proposal}</span></div><button class="btn primary" onclick="proposalModal()">${t('بررسی پیشنهاد','Review proposal')}</button></section></div>`)}
function evidence(){return shell(t('شواهد','Evidence'),t('منبع یک تفسیر','BASIS OF UNDERSTANDING'),`<div class="grid"><section class="card"><div class="row"><div><div class="label">WHAT</div>${t('زمان آزاد این هفته کاهش یافته است.','Available time this week decreased.')}</div><span class="status confirmed">RECORDED</span></div><div class="row"><div><div class="label">WHEN</div>2026-09-06</div><span class="tag">timestamp</span></div><div class="row"><div><div class="label">SOURCE / ORIGIN</div>${t('ورودی مستقیم کاربر','Direct user input')}</div><span class="tag">user</span></div><div class="row"><div><div class="label">CONTEXT</div>${t('برنامه هفتگی','Weekly planning')}</div><span class="tag">context</span></div><div class="notice">${t('ثبت‌شده با تفسیر یکی نیست.','Recorded is not the same as inferred.')}</div></section></div>`)}
function understand(){return shell(t('درک','Understand'),t('DECIVEXA چه می‌فهمد؟','WHAT DECIVEXA CURRENTLY UNDERSTANDS'),`<div class="grid"><section class="card"><div class="row"><div><div class="big">${t('وقتی ظرفیت کاهش می‌یابد، مسیر تدریجی برای این هدف مناسب‌تر است.','When capacity drops, a gradual path may be more suitable for this goal.')}</div><p class="muted">${t('بر اساس شواهد ثبت‌شده و تاریخچه مسیر.','Based on recorded evidence and path history.')}</p></div><span class="status inferred">${S.correction==='CONFIRMED'?'UPDATED':'INFERRED'}</span></div><div class="row"><span>${t('اصلاح وابسته','Dependent review')}</span><span class="status ${S.correction==='REVIEW REQUIRED'?'questioned':'confirmed'}">${S.correction==='REVIEW REQUIRED'?'REVIEW REQUIRED':'NO OPEN REVIEW'}</span></div><div class="footerbar"><button class="btn" onclick="correctionModal()">${t('این دقیق نیست','This is not accurate')}</button><button class="btn" onclick="setView('evidence')">${t('چرا؟','Why?')}</button></div></section><section class="card"><div class="row"><span>${t('درک تأییدشده','Confirmed understanding')}</span><span class="status confirmed">CONFIRMED</span></div><button class="btn" onclick="openStateModal('stale')">${t('بررسی درک قدیمی','Review stale understanding')}</button><button class="btn" onclick="openStateModal('contradiction')">${t('بررسی تناقض','Review contradiction')}</button></section></div>`)}
function decisions(){return shell(t('تصمیم‌ها','Decisions'),t('انتخاب‌هایی که نیاز به قضاوت دارند','CHOICES THAT DESERVE JUDGMENT'),`<div class="grid"><section class="card"><div class="label">ACTIVE DECISION</div><div class="big">${t('آیا مسیر سریع‌تر را انتخاب کنم یا تدریجی؟','Should I choose a faster or gradual path?')}</div><p class="muted">${t('سه گزینه، چند trade-off، بدون امتیاز جهانی.','Three options, explicit trade-offs, no universal score.')}</p><button class="btn primary" onclick="setView('decisiondetail')">${t('باز کردن تصمیم','Open decision')}</button></section></div>`)}
function decisiondetail(){let opts=[t('سریع‌تر — زمان کمتر، فشار بیشتر','Faster — less time, higher pressure'),t('متعادل — فشار متوسط، زمان متوسط','Balanced — moderate pressure and time'),t('تدریجی — فشار کمتر، زمان بیشتر','Gradual — lower pressure, more time')];return shell(t('انتخاب مسیر','Choose a path'),t('تصمیم / فضای مقایسه','DECISION WORKSPACE'),`<div class="grid"><section class="card"><div class="label">OPTIONS</div><div class="stack">${opts.map((o,i)=>`<button class="option ${S.decision===i?'selected':''}" aria-pressed="${S.decision===i}" onclick="selectOption(${i})">${o}</button>`).join('')}</div></section><section class="card"><div class="label">HUMAN JUDGMENT</div><p>${t('DECIVEXA trade-offها را توضیح می‌دهد؛ انتخاب نهایی متعلق به انسان است.','DECIVEXA explains trade-offs; final judgment remains human.')}</p><button class="btn primary" ${S.decision===null?'disabled':''} onclick="commitDecision()">${t('ثبت تصمیم انتخاب‌شده','Commit selected decision')}</button></section></div>`)}
function search(){let q=S.search;return shell(t('جستجو','Search'),t('جستجوی زمینه‌مند','CONTEXT-AWARE SEARCH'),`<input id="q" class="search" aria-label="${t('جستجو','Search')}" placeholder="${t('هدف، شواهد، تصمیم، درک...','Goal, evidence, decision, understanding...')}" value="${q}"><div class="grid" style="margin-top:16px"><section class="card"><div class="row"><div><div class="label">GOAL</div>${t('آماده‌سازی برای مهاجرت حرفه‌ای','Prepare for a professional transition')}<div class="tag">${t('هدف · مسیر · امروز','Goal · path · today')}</div></div><button class="btn" onclick="setView('goaldetail')">${t('ادامه در زمینه','Continue in context')}</button></div><div class="row"><div><div class="label">UNDERSTANDING</div>${t('مسیر تدریجی در ظرفیت پایین','Gradual path under lower capacity')}<div class="tag">${t('درک · استنباط‌شده','Understanding · inferred')}</div></div><button class="btn" onclick="setView('understand')">${t('باز کردن','Open')}</button></div>${q?`<div class="notice">${t('نتایج برای «'+q+'» در زمینه فعلی نمایش داده می‌شوند.','Results for “'+q+'” are shown in the current context.')}</div>`:''}</section></div>`)}
function actionModal(){openModal(`<h2 id="dialogTitle">${t('نتیجه اقدام','Action outcome')}</h2><p>${t('نتیجه واقعی اقدام را ثبت کن.','Record what actually happened.')}</p><div class="stack"><button class="option" onclick="recordOutcome('YES')">${t('بله — نتیجه حاصل شد','Yes — outcome achieved')}</button><button class="option" onclick="recordOutcome('PARTIAL')">${t('جزئی — بخشی حاصل شد','Partially — some outcome achieved')}</button><button class="option" onclick="recordOutcome('NO')">${t('خیر — نتیجه حاصل نشد','No — outcome not achieved')}</button></div>`)}
function recordOutcome(v){S.actionOutcome=v;closeModal();if(v==='YES')announce(t('نتیجه کامل ثبت شد','Full outcome recorded'));else if(v==='PARTIAL'){S.proposal='PROPOSED';adaptModal(true)}else{S.error='NEEDS-ADAPTATION';adaptModal(true)}}
function adaptModal(fromOutcome=false){openModal(`<h2 id="dialogTitle">${t('پیشنهاد سازگاری','Adaptation proposal')}</h2><span class="status proposed">${S.proposal}</span><p>${t('DECIVEXA پیشنهاد می‌کند اقدام مسدودشده به فردا منتقل و مسیر جایگزین بررسی شود.','DECIVEXA proposes moving the blocked action to tomorrow and reviewing an alternative path.')}</p><div class="notice warn">${t('پذیرش پیشنهاد به معنی اعمال موفق تغییر نیست.','Accepting does not mean the change was successfully applied.')}</div><div class="footerbar"><button class="btn danger" onclick="rejectProposal()">${t('رد','Reject')}</button><button class="btn primary" onclick="acceptProposal()">${t('پذیرش و ادامه','Accept & continue')}</button></div>`)}
function rejectProposal(){S.proposal='REJECTED';closeModal();announce(t('پیشنهاد رد شد و وضعیت قبلی حفظ شد','Proposal rejected; prior state preserved'))}
function proposalModal(){openModal(`<h2 id="dialogTitle">${t('چرخه پیشنهاد','Proposal lifecycle')}</h2><div class="timeline"><div class="step"><b>${S.proposal}</b><br><span class="muted">${t('وضعیت فعلی پیشنهاد.','Current proposal state.')}</span></div><div class="step"><b>PROPOSED → ACCEPTED → APPLYING</b><br><span class="muted">${t('هر مرحله از مرحله بعدی جداست.','Each stage is distinct from the next.')}</span></div><div class="step"><b>APPLIED / FAILED-INCOMPLETE</b><br><span class="muted">${t('نتیجه اعمال مستقل از پذیرش ثبت می‌شود.','Application result is independent from acceptance.')}</span></div></div><div class="footerbar"><button class="btn danger" onclick="rejectProposal()">${t('رد','Reject')}</button><button class="btn primary" ${S.proposal!=='PROPOSED'?'disabled':''} onclick="acceptProposal()">${t('پذیرش','Accept')}</button></div>`)}
function acceptProposal(){S.proposal='ACCEPTED';render();setTimeout(()=>applyProposal(),50)}
function applyProposal(){S.proposal='APPLYING';render();setTimeout(()=>{S.proposal='FAILED-INCOMPLETE';S.error='PARTIAL';openRecoveryModal()},250)}
function openRecoveryModal(){openModal(`<h2 id="dialogTitle">${t('اعمال ناقص — بازیابی','Incomplete application — recovery')}</h2><span class="status failed">FAILED-INCOMPLETE</span><div class="notice error"><b>${t('چه اتفاقی افتاد؟','What happened?')}</b><br>${t('فقط انتقال زمان ثبت شد؛ مسیر جایگزین اعمال نشد.','Only the schedule move was recorded; the alternative path was not applied.')}</div><div class="notice ok"><b>${t('چه چیزی حفظ شد؟','What was preserved?')}</b><br>${t('تصمیم، شواهد و وضعیت قبلی مسیر حفظ شده‌اند.','Decision, evidence and prior path state are preserved.')}</div><div class="footerbar"><button class="btn" onclick="recoverState()">${t('بازگشت با وضعیت حفظ‌شده','Return with preserved state')}</button><button class="btn primary" onclick="retryApply()">${t('تلاش مجدد','Retry')}</button></div>`)}
function recoverState(){S.error='RECOVERED';closeModal();setView('today');announce(t('وضعیت حفظ شد؛ تغییر ناقص برای بررسی باقی ماند','State preserved; incomplete change remains for review'))}
function retryApply(){S.proposal='APPLIED';S.error='RECOVERED';openModal(`<h2 id="dialogTitle">${t('اعمال موفق','Applied')}</h2><div class="notice ok">${t('تغییر اکنون به‌طور کامل اعمال شد.','The change is now fully applied.')}</div><div class="footerbar"><button class="btn primary" onclick="recoverState()">${t('بازگشت','Return')}</button></div>`)}
function correctionModal(){openModal(`<h2 id="dialogTitle">${t('اصلاح درک','Correct understanding')}</h2><div class="notice">${t('فعلی: مسیر تدریجی احتمالاً مناسب‌تر است.','Current: a gradual path may be more suitable.')}</div><p><b>${t('اصلاح پیشنهادی:','Your correction:')}</b> ${t('در شرایط فعلی، مسیر متعادل برای من مناسب‌تر است.','Under current conditions, a balanced path is more suitable for me.')}</p><div class="notice warn">${t('اصلاح، dependent interpretations را خودکار تغییر نمی‌دهد؛ آن‌ها برای بازبینی علامت‌گذاری می‌شوند.','The correction does not automatically change dependent interpretations; they are marked for review.')}</div><div class="footerbar"><button class="btn" onclick="closeModal()">${t('انصراف','Cancel')}</button><button class="btn primary" onclick="confirmCorrection()">${t('تأیید اصلاح','Confirm correction')}</button></div>`)}
function confirmCorrection(){S.correction='REVIEW REQUIRED';closeModal();render();announce(t('اصلاح ثبت شد؛ موارد وابسته برای بازبینی علامت‌گذاری شدند','Correction recorded; dependent items marked for review'))}
function openStateModal(type){if(type==='stale')openModal(`<h2 id="dialogTitle">${t('درک قدیمی','Outdated understanding')}</h2><span class="status stale">STALE ≠ FALSE</span><p>${t('این درک در گذشته معتبر بوده اما برای وضعیت فعلی دوباره ارزیابی نشده است.','This understanding may have been valid before but has not been revalidated for the current state.')}</p><button class="btn primary" onclick="closeModal();announce(t('برای بازبینی مجدد علامت‌گذاری شد','Marked for revalidation'))">${t('علامت‌گذاری برای بازبینی','Mark for revalidation')}</button>`);else openModal(`<h2 id="dialogTitle">${t('تناقض باز','Open contradiction')}</h2><span class="status questioned">QUESTIONED</span><p>${t('دو شواهد یا تفسیر با یکدیگر هم‌راستا نیستند. DECIVEXA نتیجه قطعی تحمیل نمی‌کند.','Two evidence items or interpretations are not aligned. DECIVEXA does not force a resolution.')}</p><button class="btn primary" onclick="closeModal();announce(t('تناقض باز باقی ماند؛ تصمیم قطعی ساخته نشد','Contradiction remains open; no forced resolution'))">${t('حفظ وضعیت باز','Keep unresolved')}</button>`)}
function commitDecision(){if(S.decision===null)return;let name=['سریع‌تر','متعادل','تدریجی'][S.decision];openModal(`<h2 id="dialogTitle">${t('پیش‌نمایش پیامد تصمیم','Decision consequence preview')}</h2><div class="notice">${t('این تصمیم ثبت خواهد شد. اقدام مرتبط هنوز تعهد اجرایی نیست.','This decision will be committed. Related action is not an execution commitment yet.')}</div><div class="row"><span>${t('گزینه انتخاب‌شده','Selected option')}</span><b>${t(name,['Faster','Balanced','Gradual'][S.decision])}</b></div><div class="row"><span>${t('اقدام مرتبط','Related action')}</span><span class="status proposed">PROPOSED</span></div><div class="footerbar"><button class="btn" onclick="closeModal()">${t('بازگشت','Back')}</button><button class="btn primary" onclick="closeModal();announce(t('تصمیم ثبت شد؛ اقدام مرتبط همچنان پیشنهادی است','Decision committed; related action remains proposed'))">${t('ثبت تصمیم','Commit decision')}</button></div>`)}
function selectOption(i){S.decision=i;render();announce(t('گزینه انتخاب شد؛ هنوز تصمیم ثبت نشده است','Option selected; decision not committed'))}
let modalInvoker=null;function openModal(html){modalInvoker=document.activeElement;document.getElementById('dialogBody').innerHTML=html;const m=document.getElementById('modal');m.classList.add('open');setTimeout(()=>{document.getElementById('dialog').focus()},0)}
function closeModal(){const inv=modalInvoker;document.getElementById('modal').classList.remove('open');modalInvoker=null;if(inv&&document.contains(inv)){inv.focus()}else document.getElementById('main').focus()}
function trapFocus(e){if(e.key!=='Tab')return;const d=document.getElementById('dialog');if(!document.getElementById('modal').classList.contains('open'))return;const els=[...d.querySelectorAll('button:not([disabled]),input,[href]')];if(!els.length){e.preventDefault();return}const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
const views={home,today,goals,goaldetail,evidence,understand,decisions,decisiondetail,search};
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===S.view));document.getElementById('main').innerHTML=(views[S.view]||home)();document.documentElement.dir=S.lang==='fa'?'rtl':'ltr';document.documentElement.lang=S.lang;document.getElementById('mobileNav').innerHTML=labels.map(x=>`<button data-view="${x[2].toLowerCase()}" aria-label="${S.lang==='fa'?x[1]:x[2]}">${x[0]}<br>${S.lang==='fa'?x[1]:x[2]}</button>`).join('');document.querySelectorAll('#nav button,#mobileNav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));if(S.view==='search'){const q=document.getElementById('q');q.addEventListener('input',e=>{S.search=e.target.value;announce(t('جستجو به‌روزرسانی شد','Search updated'))})}}
document.getElementById('lang').onclick=()=>{S.lang=S.lang==='fa'?'en':'fa';render();announce(S.lang==='fa'?'زبان فارسی فعال شد':'English language active')};document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modal').classList.contains('open'))closeModal();trapFocus(e)});S.context=['home'];render();
</script></body></html>
