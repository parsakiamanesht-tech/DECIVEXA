<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DECIVEXA — Prototype V1</title>
<style>
:root{--bg:#f7f6f3;--surface:#fff;--surface2:#f0eee9;--text:#17161a;--muted:#69666f;--border:#ddd9d2;--brand:#7464de;--brand2:#5d4bc8;--ok:#287a58;--warn:#9a6b16;--danger:#a33b45;--shadow:0 8px 30px rgba(23,22,26,.07);--r:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.sidebar{background:#fff;border-inline-end:1px solid var(--border);padding:24px 16px;position:sticky;top:0;height:100vh}.logo{font-weight:800;font-size:22px;letter-spacing:.02em;padding:8px 12px 28px}.nav{display:grid;gap:6px}.nav button,.utility button{border:0;background:transparent;text-align:start;padding:11px 12px;border-radius:12px;color:var(--muted)}.nav button.active{background:#eeeafd;color:var(--brand2);font-weight:700}.utility{position:absolute;bottom:18px;left:16px;right:16px}.main{max-width:1180px;width:100%;margin:auto;padding:34px 34px 80px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:28px}.eyebrow{color:var(--muted);font-size:13px}.title{font-size:32px;line-height:1.25;margin:4px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--border);background:var(--surface);padding:9px 14px;border-radius:11px}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.danger{color:var(--danger)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{grid-column:span 12;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}.half{grid-column:span 6}.third{grid-column:span 4}.label{font-size:12px;color:var(--muted);margin-bottom:5px}.big{font-size:21px;font-weight:750}.muted{color:var(--muted)}.status{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:999px;padding:3px 9px;font-size:12px}.status.inferred{color:#5b48b9;background:#f0edff}.status.confirmed{color:var(--ok);background:#edf8f2}.status.stale{color:var(--warn);background:#fff7e6}.status.proposed{color:#5b48b9;background:#f0edff}.status.failed{color:var(--danger);background:#fff0f1}.status.questioned{color:var(--warn);background:#fff7e6}.row{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:13px 0;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.stack{display:grid;gap:10px}.notice{padding:13px 15px;border-radius:12px;background:var(--surface2);border:1px solid var(--border)}.notice.warn{background:#fff8e9}.notice.error{background:#fff1f2}.notice.ok{background:#edf8f2}.tag{font-size:12px;color:var(--muted)}.timeline{border-inline-start:2px solid var(--border);padding-inline-start:18px}.step{margin:0 0 18px}.modal{position:fixed;inset:0;background:rgba(10,9,14,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.dialog{max-width:620px;width:100%;background:var(--surface);border-radius:20px;padding:24px;box-shadow:0 24px 80px rgba(0,0,0,.2)}.dialog h2{margin-top:0}.option{border:1px solid var(--border);padding:13px;border-radius:12px;text-align:start;background:#fff;width:100%}.option.selected{border-color:var(--brand);background:#f1efff}.footerbar{margin-top:18px;display:flex;justify-content:space-between;gap:10px}.search{width:min(430px,100%);padding:10px 13px;border:1px solid var(--border);border-radius:12px;background:#fff}.hidden{display:none!important}.kbd{font-family:ui-monospace,monospace;border:1px solid var(--border);padding:1px 5px;border-radius:5px;font-size:12px}.lang{font-size:13px}.focus:focus-visible,.btn:focus-visible,.nav button:focus-visible,.option:focus-visible,.search:focus-visible{outline:3px solid #b6adff;outline-offset:2px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:900px){.app{grid-template-columns:76px 1fr}.sidebar{padding:16px 8px}.logo{font-size:18px;text-align:center}.nav button{font-size:0;text-align:center}.nav button::first-letter{font-size:18px}.utility button{font-size:0}.main{padding:24px 18px}.half,.third{grid-column:span 12}.title{font-size:28px}}@media(max-width:620px){.app{display:block}.sidebar{position:fixed;bottom:0;top:auto;left:0;right:0;width:100%;height:auto;border-inline-end:0;border-top:1px solid var(--border);z-index:10;padding:7px;background:#fff}.logo,.utility{display:none}.nav{grid-template-columns:repeat(5,1fr)}.nav button{font-size:11px;padding:8px 2px;text-align:center}.main{padding:20px 14px 92px}.top{align-items:flex-start;flex-direction:column}.grid{gap:12px}.card{padding:16px}.dialog{padding:19px}.row{align-items:flex-start}.actions{width:100%}.actions .btn{flex:1}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" aria-label="Primary navigation"><div class="logo">DECIVEXA</div><nav class="nav">
<button data-view="home">⌂ <span>خانه</span></button><button data-view="today">◷ <span>امروز</span></button><button data-view="goals">◎ <span>اهداف</span></button><button data-view="understand">◌ <span>درک</span></button><button data-view="decisions">◇ <span>تصمیم‌ها</span></button>
</nav><div class="utility"><button data-view="search">⌕ جستجو</button><button id="lang">English / فارسی</button></div></aside>
<main id="main" class="main" tabindex="-1"></main>
</div>
<div id="modal" class="modal" role="presentation"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1"><div id="dialogBody"></div></div></div>
<div id="status" class="sr" role="status" aria-live="polite"></div>
<script>
const S={view:'home',lang:'fa',proposal:'proposed',correction:false,decision:false,error:false,search:''};
const fa={home:'خانه',today:'امروز',goals:'اهداف',understand:'درک',decisions:'تصمیم‌ها'};
function t(a,b){return S.lang==='fa'?a:b}function announce(x){document.getElementById('status').textContent=x}
function setView(v){S.view=v;render();window.scrollTo(0,0)}
function shell(title,eyebrow,body,actions=''){return `<div class="top"><div><div class="eyebrow">${eyebrow}</div><h1 class="title">${title}</h1></div><div class="actions">${actions}</div></div>${body}`}
function home(){return shell(t('جایی که هستی، قبل از اینکه بگویی چه کاری انجام بدهی.','Where you are, before what you should do next.'),t('جهت امروز','TODAY’S ORIENTATION'),`<div class="grid"><section class="card"><div class="label">${t('تمرکز اصلی','PRIMARY FOCUS')}</div><div class="big">${t('آماده‌سازی برای مهاجرت حرفه‌ای','Prepare for a professional transition')}</div><p class="muted">${t('چرا حالا؟ ظرفیت زمانی این هفته تغییر کرده و این هدف به تصمیم فعلی تو مرتبط است.','Why now? This week’s capacity changed and this goal is connected to a current decision.')}</p><button class="btn primary" onclick="setView('goaldetail')">${t('مشاهده هدف','Open goal')}</button></section><section class="card half"><div class="label">${t('تغییر معنادار','MEANINGFUL CHANGE')}</div><div class="big">${t('ظرفیت امروز کمتر شده','Today’s capacity is lower')}</div><p class="muted">${t('برنامه نیاز به بازتنظیم دارد؛ هیچ تصمیمی هنوز اعمال نشده است.','The plan needs adaptation; no decision has been applied.')}</p></section><section class="card half"><div class="label">${t('قدم بعدی','NEXT')}</div><div class="big">${t('بررسی مسیر هدف','Review the goal path')}</div><p class="muted">${t('یک مسیر جایگزین قبلاً پیشنهاد شده است.','An alternative path has been proposed.')}</p></section></div>`)}
function today(){return shell(t('امروز','Today'),t('عملیات روزانه','DAILY OPERATING SURFACE'),`<div class="grid"><section class="card"><div class="label">${t('جهت امروز','TODAY’S DIRECTION')}</div><div class="big">${t('یک گام معنادار، نه فهرست بلند کارها','One meaningful step, not a long task list')}</div></section><section class="card half"><div class="label">${t('اقدام اولویت‌دار','PRIORITY ACTION')}</div><div class="big">${t('ارسال مدارک برای بررسی','Send documents for review')}</div><p class="muted">${t('هدف: آماده‌سازی مسیر مهاجرت حرفه‌ای','Goal: prepare professional transition')}</p><button class="btn primary" onclick="actionModal()">${t('باز کردن اقدام','Open action')}</button></section><section class="card half"><div class="label">${t('ظرفیت','CAPACITY')}</div><div class="big">${t('متوسط رو به پایین','Moderate → low')}</div><p class="muted">${t('زمان آزاد کمتر از برنامه اولیه است.','Available time is below the original plan.')}</p></section><section class="card"><div class="label">${t('تغییرات امروز','CHANGES')}</div><div class="row"><span>${t('یک اقدام مسدود شده','One action is blocked')}</span><button class="btn" onclick="adaptModal()">${t('بررسی سازگاری','Review adaptation')}</button></div></section></div>`)}
function goals(){return shell(t('اهداف','Goals'),t('جهت و مسیر','DIRECTION & PATH'),`<div class="grid"><section class="card"><div class="label">ACTIVE GOAL</div><div class="big">${t('آماده‌سازی برای مهاجرت حرفه‌ای','Prepare for a professional transition')}</div><p>${t('مسیر فعلی نیاز به بازبینی دارد.','Current path needs review.')}</p><button class="btn primary" onclick="setView('goaldetail')">${t('ورود به فضای هدف','Open goal workspace')}</button></section><section class="card"><div class="label">NEEDS ATTENTION</div><div class="row"><span>${t('وابستگی حل‌نشده','Unresolved dependency')}</span><span class="status stale">${t('نیازمند بررسی','Needs review')}</span></div></section></div>`)}
function goaldetail(){return shell(t('آماده‌سازی برای مهاجرت حرفه‌ای','Prepare for a professional transition'),t('هدف / فضای کاری','GOAL WORKSPACE'),`<div class="grid"><section class="card half"><div class="label">${t('وضعیت فعلی','CURRENT STATE')}</div><div class="big">${t('مسیر موجود، اما ظرفیت محدود','Path exists, capacity is constrained')}</div><p class="muted">${t('این وضعیت یک تفسیر است، نه واقعیت خام.','This is an interpretation, not raw reality.')}</p></section><section class="card half"><div class="label">${t('آمادگی هدف','READINESS')}</div><div class="big">${t('نیازمند حل یک وابستگی','One dependency unresolved')}</div></section><section class="card"><div class="label">${t('شواهد مرتبط','EVIDENCE')}</div><div class="row"><span>${t('ثبت تغییر ظرفیت زمانی','Recorded change in time capacity')}</span><span class="status confirmed">CONFIRMED</span></div><div class="row"><span>${t('تفسیر مسیر فعلی','Interpretation of current path')}</span><span class="status inferred">INFERRED</span></div><button class="btn" onclick="setView('evidence')">${t('مشاهده شواهد','View evidence')}</button></section><section class="card"><div class="label">${t('مسیر پیشنهادی','PROPOSED PATH')}</div><div class="notice">${t('DECIVEXA یک مسیر جایگزین پیشنهاد کرده است. این پیشنهاد هنوز تغییری در برنامه ایجاد نکرده.','DECIVEXA proposed an alternative path. The proposal has not changed the plan.')}</div><button class="btn primary" onclick="proposalModal()">${t('بررسی پیشنهاد','Review proposal')}</button></section></div>`)}
function evidence(){return shell(t('شواهد','Evidence'),t('منبع یک تفسیر','BASIS OF UNDERSTANDING'),`<div class="grid"><section class="card"><div class="row"><div><div class="label">WHAT</div>${t('زمان آزاد این هفته کاهش یافته است.','Available time this week decreased.')}</div><span class="status confirmed">RECORDED</span></div><div class="row"><div><div class="label">WHEN</div>2026-09-06</div><span class="tag">timestamp</span></div><div class="row"><div><div class="label">SOURCE / ORIGIN</div>${t('ورودی مستقیم کاربر','Direct user input')}</div><span class="tag">user</span></div><div class="row"><div><div class="label">CONTEXT</div>${t('برنامه هفتگی','Weekly planning')}</div></div><div class="notice">${t('این صفحه «آنچه ثبت شده» را از «آنچه استنباط شده» جدا نگه می‌دارد.','This surface separates what was recorded from what was inferred.')}</div></section></div>`)}
function understand(){return shell(t('درک','Understand'),t('DECIVEXA چه می‌فهمد؟','WHAT DECIVEXA CURRENTLY UNDERSTANDS'),`<div class="grid"><section class="card"><div class="row"><div><div class="big">${t('وقتی ظرفیت کاهش می‌یابد، مسیر تدریجی برای این هدف مناسب‌تر است.','When capacity drops, a gradual path may be more suitable for this goal.')}</div><p class="muted">${t('چرا؟ بر اساس تغییر ثبت‌شده در ظرفیت و تاریخچه مسیر.','Why? Based on recorded capacity change and path history.')}</p></div><span class="status inferred">INFERRED</span></div><div class="footerbar"><button class="btn" onclick="correctionModal()">${t('این دقیق نیست','This is not accurate')}</button><button class="btn" onclick="setView('evidence')">${t('چرا؟','Why?')}</button></div></section><section class="card"><div class="row"><span>${t('یک درک تأییدشده','Confirmed understanding')}</span><span class="status confirmed">CONFIRMED</span></div><div class="row"><span>${t('یک درک قدیمی','Outdated understanding')}</span><span class="status stale">STALE</span></div><div class="row"><span>${t('یک تناقض باز','Open contradiction')}</span><span class="status questioned">QUESTIONED</span></div></section></div>`)}
function decisions(){return shell(t('تصمیم‌ها','Decisions'),t('انتخاب‌هایی که نیاز به قضاوت دارند','CHOICES THAT DESERVE JUDGMENT'),`<div class="grid"><section class="card"><div class="label">ACTIVE DECISION</div><div class="big">${t('آیا مسیر سریع‌تر را انتخاب کنم یا تدریجی؟','Should I choose a faster or gradual path?')}</div><p class="muted">${t('سه گزینه، چند trade-off، بدون امتیاز جهانی.','Three options, explicit trade-offs, no universal score.')}</p><button class="btn primary" onclick="setView('decisiondetail')">${t('باز کردن تصمیم','Open decision')}</button></section></div>`)}
function decisiondetail(){return shell(t('انتخاب مسیر','Choose a path'),t('تصمیم / فضای مقایسه','DECISION WORKSPACE'),`<div class="grid"><section class="card"><div class="label">OPTIONS</div><div class="stack"><button class="option" onclick="selectOption(this)">${t('سریع‌تر — زمان کمتر، فشار بیشتر','Faster — less time, higher pressure')}</button><button class="option" onclick="selectOption(this)">${t('متعادل — فشار متوسط، زمان متوسط','Balanced — moderate pressure and time')}</button><button class="option" onclick="selectOption(this)">${t('تدریجی — فشار کمتر، زمان بیشتر','Gradual — lower pressure, more time')}</button></div></section><section class="card"><div class="label">HUMAN JUDGMENT</div><p>${t('DECIVEXA trade-offها را توضیح می‌دهد؛ انتخاب نهایی متعلق به انسان است.','DECIVEXA explains trade-offs; final judgment remains human.')}</p><button class="btn primary" onclick="commitDecision()">${t('ثبت تصمیم انتخاب‌شده','Commit selected decision')}</button></section></div>`)}
function search(){return shell(t('جستجو','Search'),t('جستجوی زمینه‌مند','CONTEXT-AWARE SEARCH'),`<input id="q" class="search" placeholder="${t('هدف، شواهد، تصمیم، درک...','Goal, evidence, decision, understanding...')}" value="${S.search}" oninput="S.search=this.value;render()"><div class="grid" style="margin-top:16px"><section class="card"><div class="row"><div><div class="label">GOAL</div>${t('آماده‌سازی برای مهاجرت حرفه‌ای','Prepare for a professional transition')}<div class="tag">${t('هدف · مسیر · امروز','Goal · path · today')}</div></div><button class="btn" onclick="setView('goaldetail')">${t('ادامه در زمینه','Continue in context')}</button></div><div class="row"><div><div class="label">UNDERSTANDING</div>${t('مسیر تدریجی در ظرفیت پایین','Gradual path under lower capacity')}<div class="tag">${t('درک · استنباط‌شده','Understanding · inferred')}</div></div><button class="btn" onclick="setView('understand')">${t('باز کردن','Open')}</button></div></section></div>`)}
function actionModal(){openModal(`<h2 id="dialogTitle">${t('ارسال مدارک برای بررسی','Send documents for review')}</h2><p>${t('هدف این اقدام آماده‌سازی مسیر مهاجرت حرفه‌ای است.','The outcome supports the professional transition goal.')}</p><div class="notice">${t('اگر نتیجه متفاوت بود، ثبت «جزئی/انجام نشد» به‌جای تکمیل صوری ممکن است.','If the outcome differs, record partial/not achieved rather than false completion.')}</div><div class="footerbar"><button class="btn" onclick="closeModal()">${t('بعداً','Later')}</button><button class="btn primary" onclick="closeModal();announce(t('نتیجه اقدام ثبت شد','Action outcome recorded'))">${t('ثبت نتیجه','Record outcome')}</button></div>`)}
function adaptModal(){openModal(`<h2 id="dialogTitle">${t('پیشنهاد سازگاری','Adaptation proposal')}</h2><span class="status proposed">PROPOSED</span><p>${t('DECIVEXA پیشنهاد می‌کند اقدام مسدودشده به فردا منتقل و مسیر جایگزین بررسی شود.','DECIVEXA proposes moving the blocked action to tomorrow and reviewing an alternative path.')}</p><div class="notice warn">${t('پذیرفتن پیشنهاد به معنی اعمال موفق تغییر نیست. نتیجه اعمال جداگانه نمایش داده می‌شود.','Accepting the proposal does not mean the change was successfully applied. Application result is separate.')}</div><div class="footerbar"><button class="btn danger" onclick="closeModal();announce(t('پیشنهاد رد شد','Proposal rejected'))">${t('رد','Reject')}</button><button class="btn primary" onclick="closeModal();proposalModal()">${t('بررسی و پذیرش','Review & accept')}</button></div>`)}
function proposalModal(){openModal(`<h2 id="dialogTitle">${t('بررسی پیشنهاد','Review proposal')}</h2><div class="timeline"><div class="step"><b>1. PROPOSED</b><br><span class="muted">${t('پیشنهاد هنوز وضعیت را تغییر نداده است.','The proposal has not changed state.')}</span></div><div class="step"><b>2. ACCEPTED</b><br><span class="muted">${t('اگر تأیید کنی، وارد مرحله اعمال می‌شود.','If accepted, it moves to application.')}</span></div><div class="step"><b>3. APPLICATION RESULT</b><br><span class="muted">${t('موفق یا ناقص/ناموفق، مستقل از پذیرش.','Success or incomplete/failure, independent of acceptance.')}</span></div></div><div class="footerbar"><button class="btn" onclick="closeModal();announce(t('پیشنهاد رد شد','Proposal rejected'))">${t('رد','Reject')}</button><button class="btn primary" onclick="applyProposal()">${t('پذیرش و ادامه','Accept & continue')}</button></div>`)}
function applyProposal(){openModal(`<h2 id="dialogTitle">${t('نتیجه اعمال','Application result')}</h2><div class="notice warn">${t('پیشنهاد پذیرفته شد، اما فقط بخشی از تغییر اعمال شد. وضعیت باقی‌مانده نیازمند بررسی است.','The proposal was accepted, but only part of the change was applied. The remaining state needs review.')}</div><div class="footerbar"><button class="btn" onclick="closeModal();announce(t('وضعیت حفظ شد؛ بخش اعمال‌نشده برای بررسی باقی ماند','State preserved; unapplied part remains for review'))">${t('متوجه شدم','Continue')}</button></div>`)}
function correctionModal(){openModal(`<h2 id="dialogTitle">${t('اصلاح درک','Correct understanding')}</h2><p>${t('چه بخشی نادرست است؟','What is inaccurate?')}</p><div class="notice">${t('فعلی: مسیر تدریجی احتمالاً مناسب‌تر است.','Current: a gradual path may be more suitable.')}</div><p><b>${t('اصلاح پیشنهادی:','Your correction:')}</b> ${t('در شرایط فعلی، مسیر متعادل برای من مناسب‌تر است.','Under current conditions, a balanced path is more suitable for me.')}</p><div class="notice warn">${t('این اصلاح می‌تواند برخی تفسیرهای وابسته را برای بازبینی علامت‌گذاری کند؛ تغییر آن‌ها هنوز قطعی نیست.','This correction may mark dependent interpretations for review; their change is not yet established.')}</div><div class="footerbar"><button class="btn" onclick="closeModal()">${t('انصراف','Cancel')}</button><button class="btn primary" onclick="closeModal();announce(t('اصلاح ثبت شد و موارد وابسته برای بازبینی علامت‌گذاری شدند','Correction recorded; dependent items marked for review'))">${t('تأیید اصلاح','Confirm correction')}</button></div>`)}
function commitDecision(){openModal(`<h2 id="dialogTitle">${t('پیش‌نمایش پیامد تصمیم','Decision consequence preview')}</h2><div class="notice">${t('تصمیم انتخاب‌شده ثبت خواهد شد. اقدامات مرتبط هنوز تعهد اجرایی محسوب نمی‌شوند.','The selected decision will be committed. Related actions are not execution commitments yet.')}</div><div class="row"><span>${t('تصمیم','Decision')}</span><b>${t('مسیر انتخاب‌شده','Selected path')}</b></div><div class="row"><span>${t('اقدام مرتبط','Related action')}</span><span class="status proposed">PROPOSED</span></div><div class="footerbar"><button class="btn" onclick="closeModal()">${t('بازگشت','Back')}</button><button class="btn primary" onclick="closeModal();announce(t('تصمیم ثبت شد؛ اقدام مرتبط همچنان پیشنهادی است','Decision committed; related action remains proposed'))">${t('ثبت تصمیم','Commit decision')}</button></div>`)}
function selectOption(el){document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');announce(t('گزینه انتخاب شد؛ هنوز تصمیم ثبت نشده است','Option selected; decision not committed'))}
function openModal(html){document.getElementById('dialogBody').innerHTML=html;document.getElementById('modal').classList.add('open');setTimeout(()=>document.querySelector('.dialog').focus(),0)}
function closeModal(){document.getElementById('modal').classList.remove('open');document.querySelector('.nav button.active')?.focus()}
const views={home,today,goals,goaldetail,evidence,understand,decisions,decisiondetail,search};
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===S.view));const f=views[S.view]||home;document.getElementById('main').innerHTML=f();document.documentElement.dir=S.lang==='fa'?'rtl':'ltr';document.documentElement.lang=S.lang}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
document.getElementById('lang').addEventListener('click',()=>{S.lang=S.lang==='fa'?'en':'fa';render();announce(S.lang==='fa'?'زبان فارسی فعال شد':'English language active')});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script>
</body></html>
