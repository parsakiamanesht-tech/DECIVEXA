<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DECIVEXA — Runtime Fidelity Pass 05</title>
<style>
:root{--bg:#f7f6f3;--surface:#fff;--surface2:#f0eee9;--text:#17161a;--muted:#69666f;--border:#ddd9d2;--brand:#7464de;--brand2:#5d4bc8;--ok:#287a58;--warn:#9a6b16;--danger:#a33b45;--r:16px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.sidebar{background:#fff;border-inline-end:1px solid var(--border);padding:24px 16px;position:sticky;top:0;height:100vh}.logo{font-weight:800;font-size:22px;padding:8px 12px 28px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;text-align:start;padding:11px 12px;border-radius:12px;color:var(--muted)}.nav button.active{background:#eeeafd;color:var(--brand2);font-weight:700}.main{max-width:1180px;width:100%;margin:auto;padding:34px 34px 100px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:28px}.eyebrow,.label{color:var(--muted);font-size:12px}.title{font-size:32px;line-height:1.25;margin:4px 0}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{grid-column:span 12;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px}.half{grid-column:span 6}.big{font-size:21px;font-weight:750}.muted{color:var(--muted)}.status{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:999px;padding:3px 9px;font-size:12px}.proposed{color:#5b48b9;background:#f0edff}.confirmed,.applied{color:var(--ok);background:#edf8f2}.failed,.rejected{color:var(--danger);background:#fff0f1}.questioned,.stale{color:var(--warn);background:#fff7e6}.row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.stack{display:grid;gap:10px}.notice{padding:13px 15px;border-radius:12px;background:var(--surface2);border:1px solid var(--border)}.notice.ok{background:#edf8f2}.notice.error{background:#fff1f2}.notice.warn{background:#fff8e9}.btn{border:1px solid var(--border);background:var(--surface);padding:9px 14px;border-radius:11px}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.option{border:1px solid var(--border);padding:13px;border-radius:12px;text-align:start;background:#fff;width:100%}.option.selected{border-color:var(--brand);background:#f1efff}.actions{display:flex;gap:8px;flex-wrap:wrap}.footerbar{margin-top:18px;display:flex;justify-content:space-between;gap:10px}.search{width:min(520px,100%);padding:10px 13px;border:1px solid var(--border);border-radius:12px;background:#fff}.focus:focus-visible,.btn:focus-visible,.nav button:focus-visible,.option:focus-visible,.search:focus-visible{outline:3px solid #8f84ef;outline-offset:3px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.modal{position:fixed;inset:0;background:rgba(10,9,14,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.dialog{max-width:640px;width:100%;max-height:90vh;overflow:auto;background:var(--surface);border-radius:20px;padding:24px;box-shadow:0 24px 80px rgba(0,0,0,.2)}.dialog h2{margin-top:0}.mobile-nav{display:none}.meta{font-size:12px;color:var(--muted);margin-top:18px}.attempts{font-variant-numeric:tabular-nums;font-weight:700}
@media(max-width:900px){.app{grid-template-columns:76px 1fr}.sidebar{padding:16px 8px}.logo{font-size:18px;text-align:center}.nav button{font-size:0;text-align:center}.nav button::first-letter{font-size:18px}.main{padding:24px 18px 100px}.half{grid-column:span 12}.title{font-size:28px}}@media(max-width:620px){.app{display:block}.sidebar{display:none}.mobile-nav{display:grid;position:fixed;bottom:0;left:0;right:0;grid-template-columns:repeat(6,1fr);z-index:10;padding:7px;background:#fff;border-top:1px solid var(--border)}.mobile-nav button{border:0;background:transparent;padding:8px 2px;font-size:11px}.mobile-nav .lang-control{font-weight:700}.main{padding:20px 14px 96px}.top{align-items:flex-start;flex-direction:column}.card{padding:16px}.dialog{padding:19px;max-height:88vh}.actions,.footerbar{width:100%}.actions .btn,.footerbar .btn{flex:1}}
</style></head>
<body>
<div class="app"><aside class="sidebar" aria-label="Primary navigation"><div class="logo">DECIVEXA</div><nav id="nav" class="nav"></nav><div style="position:absolute;bottom:18px;left:16px;right:16px"><button class="btn" id="lang" style="width:100%">English / فارسی</button></div></aside><main id="main" class="main" tabindex="-1"></main></div><nav id="mobileNav" class="mobile-nav" aria-label="Primary navigation"></nav><div id="modal" class="modal"><div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1"><div id="dialogBody"></div></div></div><div id="status" class="sr" role="status" aria-live="polite"></div>
<script>
const KEY='decivexa.runtime-fidelity.v1';
const defaults={view:'home',lang:'fa',decision:null,decisionState:'UNCOMMITTED',correctionState:'CURRENT',dependentState:'CURRENT',proposalState:'PROPOSED',attempts:0,actionOutcome:null,lastAction:'',context:['home']};
let S=load();let invoker=null;
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return {...defaults,...(x||{}),context:Array.isArray(x?.context)&&x.context.length?x.context:['home']}}catch{return {...defaults}}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function reset(){localStorage.removeItem(KEY);S={...defaults,context:['home']};render();announce(t('وضعیت آزمایشی پاک شد','Validation state reset'))}
function t(f,e){return S.lang==='fa'?f:e}function announce(x){document.getElementById('status').textContent=x}
const labels={home:['⌂','خانه','Home'],today:['◷','امروز','Today'],goals:['◎','اهداف','Goals'],understand:['◌','درک','Understand'],decisions:['◇','تصمیم‌ها','Decisions']};
function setView(v){if(S.context[S.context.length-1]!==v)S.context.push(v);S.view=v;save();render();window.scrollTo(0,0);document.getElementById('main').focus()}
function shell(title,eyebrow,body,actions=''){return `<div class="top"><div><div class="eyebrow">${eyebrow}</div><h1 class="title">${title}</h1></div><div class="actions">${actions}</div></div>${body}`}
function home(){return shell(t('وفاداری اجرایی Prototype','Prototype execution fidelity'),t('RUNTIME-FIDELITY REFINEMENT — PASS 05','RUNTIME-FIDELITY REFINEMENT — PASS 05'),`<div class="grid"><section class="card"><div class="label">${t('هدف این artifact','ARTIFACT PURPOSE')}</div><div class="big">${t('اثبات رفتار state در مرورگر، نه فقط ظاهر UI','Prove state behavior in a browser, not only UI appearance')}</div><p class="muted">${t('وضعیت‌ها در localStorage ذخیره می‌شوند تا navigation و reload قابل آزمون باشند.','State is persisted in localStorage so navigation and reload are testable.')}</p></section><section class="card half"><div class="label">DECISION</div><div class="big">${S.decisionState}</div><p class="muted">${t('انتخاب فعلی: ','Current selection: ')}${S.decision===null?'—':['Faster','Balanced','Gradual'][S.decision]||'—'}</p></section><section class="card half"><div class="label">CORRECTION</div><div class="big">${S.correctionState}</div><p class="muted">${t('اصلاح، وضعیت وابسته‌ها را برای review تغییر می‌دهد.','Correction changes the dependent state to review.')}</p></section><section class="card half"><div class="label">DEPENDENTS</div><div class="big">${S.dependentState}</div><p class="muted">${t('این state مستقل و قابل مشاهده است.','This is an independent observable runtime state.')}</p></section><section class="card half"><div class="label">PROPOSAL</div><div class="big">${S.proposalState}</div><p class="muted">${t('پذیرش و اعمال دو state مستقل هستند.','Acceptance and application are distinct states.')}</p></section><section class="card"><div class="label">RETRY</div><div class="big">${S.attempts} ${t('تلاش','attempt(s)')}</div><p class="muted">${S.lastAction||t('هنوز اجرا نشده','Not executed yet')}</p></section><section class="card"><div class="actions"><button class="btn primary" onclick="setView('decisiondetail')">${t('آزمون Decision','Test Decision')}</button><button class="btn" onclick="setView('understand')">${t('آزمون Correction','Test Correction')}</button><button class="btn" onclick="setView('today')">${t('آزمون Retry / Persistence','Test Retry / Persistence')}</button><button class="btn" onclick="reset()">${t('Reset آزمایش','Reset validation')}</button></div></section></div>`)}
function today(){return shell(t('امروز','Today'),t('ACTION + RETRY LIFECYCLE','ACTION + RETRY LIFECYCLE'),`<div class="grid"><section class="card"><div class="label">${t('اقدام','ACTION')}</div><div class="big">${t('ارسال مدارک برای بررسی','Send documents for review')}</div><p class="muted">${t('نتیجه واقعی باید قبل از پیشنهاد سازگاری ثبت شود.','Actual outcome must be recorded before adaptation.')}</p><button class="btn primary" onclick="actionModal()">${t('ثبت نتیجه','Record outcome')}</button></section><section class="card half"><div class="label">PROPOSAL</div><div class="big">${S.proposalState}</div><button class="btn" onclick="proposalModal()">${t('مشاهده lifecycle','Inspect lifecycle')}</button></section><section class="card half"><div class="label">ATTEMPTS</div><div class="big attempts">${S.attempts}</div><p class="muted">${S.lastAction||'—'}</p></section><section class="card"><div class="notice">${t('برای اثبات reload persistence: ابتدا یک lifecycle را اجرا کن، سپس صفحه را reload کن. state باید بدون reset باقی بماند.','To prove reload persistence: execute a lifecycle, then reload the page. State must remain without reset.')}</div></section></div>`)}
function goals(){return shell(t('اهداف','Goals'),t('DIRECTION & PATH','DIRECTION & PATH'),`<div class="grid"><section class="card"><div class="big">${t('آماده‌سازی برای مهاجرت حرفه‌ای','Prepare for a professional transition')}</div><p class="muted">${t('مسیر باید با ظرفیت واقعی سازگار شود، نه با یک score جهانی.','The path adapts to actual capacity, not a universal score.')}</p><button class="btn primary" onclick="setView('today')">${t('ورود به عملیات','Open operating surface')}</button></section></div>`)}
function understand(){return shell(t('درک','Understand'),t('CORRECTION → CONFIRMATION','CORRECTION → CONFIRMATION'),`<div class="grid"><section class="card"><div class="row"><div><div class="big">${t('در شرایط فعلی، مسیر تدریجی احتمالاً مناسب‌تر است.','Under current conditions, a gradual path may be more suitable.')}</div><p class="muted">${t('این یک inference است و قابل اصلاح است.','This is an inference and is correctable.')}</p></div><span class="status ${S.correctionState==='CONFIRMED'?'confirmed':'proposed'}">${S.correctionState}</span></div><div class="row"><span>${t('وضعیت وابسته','Dependent state')}</span><span class="status ${S.dependentState==='REVIEW REQUIRED'?'questioned':'proposed'}">${S.dependentState}</span></div><div class="notice warn">${t('تأیید اصلاح، متن را به حقیقت مطلق تبدیل نمی‌کند؛ version جدید understanding را ثبت و وابسته‌ها را برای review علامت‌گذاری می‌کند.','Confirming a correction does not turn it into absolute truth; it records a new understanding version and marks dependents for review.')}</div><div class="footerbar"><button class="btn" onclick="correctionModal()">${t('اصلاح این درک','Correct this understanding')}</button><button class="btn" onclick="openStateModal()">${t('نمایش state contract','Show state contract')}</button></div></section></div>`)}
function decisions(){return shell(t('تصمیم‌ها','Decisions'),t('HUMAN JUDGMENT','HUMAN JUDGMENT'),`<div class="grid"><section class="card"><div class="big">${t('آیا مسیر سریع‌تر، متعادل یا تدریجی را انتخاب کنم؟','Should I choose faster, balanced, or gradual?')}</div><p class="muted">${t('DECIVEXA trade-offها را روشن می‌کند؛ تصمیم نهایی انسانی است.','DECIVEXA clarifies trade-offs; final judgment remains human.')}</p><button class="btn primary" onclick="setView('decisiondetail')">${t('باز کردن تصمیم','Open decision')}</button></section></div>`)}
function decisiondetail(){const opts=[['Faster',t('سریع‌تر — زمان کمتر، فشار بیشتر','Faster — less time, higher pressure')],['Balanced',t('متعادل — فشار متوسط','Balanced — moderate pressure')],['Gradual',t('تدریجی — فشار کمتر، زمان بیشتر','Gradual — lower pressure, more time')]];return shell(t('انتخاب مسیر','Choose a path'),t('DECISION / COMMIT','DECISION / COMMIT'),`<div class="grid"><section class="card"><div class="label">OPTIONS</div><div class="stack">${opts.map((o,i)=>`<button class="option ${S.decision===i?'selected':''}" aria-pressed="${S.decision===i}" onclick="selectOption(${i})">${o[1]}</button>`).join('')}</div></section><section class="card"><div class="row"><span>${t('انتخاب','Selection')}</span><b>${S.decision===null?'—':opts[S.decision][0]}</b></div><div class="row"><span>${t('وضعیت تصمیم','Decision state')}</span><span class="status ${S.decisionState==='COMMITTED'?'confirmed':'proposed'}">${S.decisionState}</span></div><p class="muted">${t('SELECTED ≠ COMMITTED.','SELECTED ≠ COMMITTED.')}</p><button class="btn primary" ${S.decision===null||S.decisionState==='COMMITTED'?'disabled':''} onclick="commitDecision()">${t('ثبت واقعی تصمیم','Commit decision')}</button></section></div>`)}
function evidence(){return shell(t('شواهد','Evidence'),t('TRACEABILITY','TRACEABILITY'),`<div class="grid"><section class="card"><div class="row"><span>decisionState</span><b>${S.decisionState}</b></div><div class="row"><span>correctionState</span><b>${S.correctionState}</b></div><div class="row"><span>dependentState</span><b>${S.dependentState}</b></div><div class="row"><span>proposalState</span><b>${S.proposalState}</b></div><div class="row"><span>attempts</span><b>${S.attempts}</b></div><div class="notice">${t('این مقادیر از runtime state خوانده می‌شوند، نه متن ثابت UI.','These values are read from runtime state, not static UI copy.')}</div></section></div>`)}
function search(){return shell(t('جستجو','Search'),t('CONTEXT','CONTEXT'),`<div class="grid"><section class="card"><input id="q" class="search" aria-label="${t('جستجو','Search')}" placeholder="${t('هدف، تصمیم، درک...','Goal, decision, understanding...')}"><p class="muted">${t('این سطح در این pass صرفاً navigation context را حفظ می‌کند.','This surface preserves navigation context in this pass.')}</p></section></div>`)}
function actionModal(){openModal(`<h2 id="dialogTitle">${t('نتیجه اقدام','Action outcome')}</h2><p>${t('نتیجه واقعی اقدام را انتخاب کن.','Choose the actual outcome.')}</p><div class="stack"><button class="option" onclick="recordOutcome('SUCCESS')">${t('موفق','Success')}</button><button class="option" onclick="recordOutcome('INCOMPLETE')">${t('ناقص / نیازمند سازگاری','Incomplete / needs adaptation')}</button></div>`)}
function recordOutcome(v){S.actionOutcome=v;save();closeModal();if(v==='SUCCESS'){S.lastAction='OUTCOME: SUCCESS';save();announce(t('نتیجه کامل ثبت شد','Full outcome recorded'))}else{S.lastAction='OUTCOME: FAILED-INCOMPLETE';S.proposalState='PROPOSED';save();adaptModal()}}
function adaptModal(){openModal(`<h2 id="dialogTitle">${t('پیشنهاد سازگاری','Adaptation proposal')}</h2><span class="status proposed">${S.proposalState}</span><p>${t('پیشنهاد: اقدام مسدودشده به فردا منتقل شود و مسیر جایگزین بررسی شود.','Proposal: move the blocked action to tomorrow and review an alternative path.')}</p><div class="notice warn">${t('ACCEPTED هنوز APPLIED نیست.','ACCEPTED is not APPLIED.')}</div><div class="footerbar"><button class="btn" onclick="rejectProposal()">${t('رد','Reject')}</button><button class="btn primary" onclick="acceptProposal()">${t('پذیرش','Accept')}</button></div>`)}
function rejectProposal(){S.proposalState='REJECTED';S.lastAction='PROPOSAL: REJECTED';save();closeModal();announce(t('پیشنهاد رد شد؛ state قبلی حفظ شد','Proposal rejected; prior state preserved'))}
function proposalModal(){openModal(`<h2 id="dialogTitle">${t('چرخه proposal','Proposal lifecycle')}</h2><div class="stack"><div class="row"><span>PROPOSED</span><b>${S.proposalState}</b></div><div class="row"><span>ATTEMPTS</span><b>${S.attempts}</b></div></div><div class="footerbar"><button class="btn" onclick="closeModal()">${t('بستن','Close')}</button><button class="btn primary" ${S.proposalState!=='PROPOSED'?'disabled':''} onclick="acceptProposal()">${t('پذیرش','Accept')}</button></div>`)}
function acceptProposal(){S.proposalState='ACCEPTED';S.lastAction='PROPOSAL: ACCEPTED';save();closeModal();setTimeout(applyProposal,60)}
function applyProposal(){S.proposalState='APPLYING';S.attempts+=1;S.lastAction=`ATTEMPT #${S.attempts}: APPLYING`;save();render();setTimeout(()=>{S.proposalState='FAILED-INCOMPLETE';S.lastAction=`ATTEMPT #${S.attempts}: FAILED-INCOMPLETE`;save();openRecoveryModal()},250)}
function openRecoveryModal(){openModal(`<h2 id="dialogTitle">${t('اعمال ناقص — بازیابی','Incomplete application — recovery')}</h2><span class="status failed">FAILED-INCOMPLETE</span><p>${t('تلاش فعلی شکست ناقص داشته است؛ state قبلی حذف نشده.','The current attempt failed incompletely; prior state was not erased.')}</p><div class="notice ok">${t('Attempt #'+S.attempts+' ثبت شده است. Retry باید Attempt جدید بسازد.','Attempt #'+S.attempts+' is recorded. Retry must create a new attempt.')}</div><div class="footerbar"><button class="btn" onclick="recoverState()">${t('بازگشت','Return')}</button><button class="btn primary" onclick="retryApply()">${t('تلاش مجدد','Retry')}</button></div>`)}
function recoverState(){S.lastAction='RECOVERED';save();closeModal();setView('today');announce(t('وضعیت حفظ شد','State preserved'))}
function retryApply(){S.attempts+=1;S.proposalState='APPLYING';S.lastAction=`ATTEMPT #${S.attempts}: APPLYING`;save();openModal(`<h2 id="dialogTitle">${t('Retry واقعی','Real retry')}</h2><div class="notice">${t('این Attempt جدید است و شماره آن افزایش یافته است.','This is a new attempt and the number has increased.')}</div><div class="row"><span>ATTEMPT</span><b>${S.attempts}</b></div><button class="btn primary" onclick="finishRetry()">${t('تکمیل موفق Retry','Complete retry successfully')}</button>`)}
function finishRetry(){S.proposalState='APPLIED';S.lastAction=`ATTEMPT #${S.attempts}: APPLIED`;save();closeModal();render();announce(t('Retry با موفقیت اعمال شد','Retry applied successfully'))}
function correctionModal(){openModal(`<h2 id="dialogTitle">${t('اصلاح درک','Correct understanding')}</h2><div class="notice">${t('نسخه فعلی: مسیر تدریجی احتمالاً مناسب‌تر است.','Current version: a gradual path may be more suitable.')}</div><p>${t('اصلاح کاربر: مسیر متعادل برای وضعیت فعلی مناسب‌تر است.','User correction: balanced is more suitable for the current state.')}</p><div class="notice warn">${t('پس از Confirm، state باید CONFIRMED شود و dependent interpretation به REVIEW REQUIRED برود.','After Confirm, state becomes CONFIRMED and dependent interpretations move to REVIEW REQUIRED.')}</div><div class="footerbar"><button class="btn" onclick="closeModal()">${t('انصراف','Cancel')}</button><button class="btn primary" onclick="confirmCorrection()">${t('تأیید اصلاح','Confirm correction')}</button></div>`)}
function confirmCorrection(){S.correctionState='CONFIRMED';S.dependentState='REVIEW REQUIRED';S.lastAction='CORRECTION: CONFIRMED → DEPENDENTS: REVIEW REQUIRED';save();closeModal();render();announce(t('اصلاح تأیید شد و وابسته‌ها برای review علامت خوردند','Correction confirmed; dependents marked for review'))}
function openStateModal(){openModal(`<h2 id="dialogTitle">${t('قرارداد state','State contract')}</h2><div class="stack"><div class="row"><span>EDIT</span><b>CORRECTION PROPOSED</b></div><div class="row"><span>CONFIRM</span><b>CONFIRMED</b></div><div class="row"><span>DEPENDENTS</span><b>REVIEW REQUIRED</b></div></div><button class="btn primary" onclick="closeModal()">${t('بستن','Close')}</button>`)}
function commitDecision(){S.decisionState='COMMITTED';S.lastAction='DECISION: COMMITTED';save();closeModal();render();announce(t('تصمیم واقعاً در runtime committed شد','Decision committed in runtime'))}
function selectOption(i){if(S.decisionState==='COMMITTED')return;S.decision=i;save();render();announce(t('گزینه انتخاب شد؛ هنوز committed نیست','Option selected; not committed yet'))}
function openModal(html){invoker=document.activeElement;document.getElementById('dialogBody').innerHTML=html;document.getElementById('modal').classList.add('open');setTimeout(()=>document.getElementById('dialog').focus(),0)}
function closeModal(){const x=invoker;document.getElementById('modal').classList.remove('open');invoker=null;if(x&&document.contains(x))x.focus();else document.getElementById('main').focus()}
function trap(e){if(e.key!=='Tab'||!document.getElementById('modal').classList.contains('open'))return;const els=[...document.querySelectorAll('#dialog button:not([disabled]),#dialog input,#dialog [href]')];if(!els.length){e.preventDefault();return}const [a,b]=[els[0],els[els.length-1]];if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}}
function toggleLang(){S.lang=S.lang==='fa'?'en':'fa';save();render()}
const views={home,today,goals,understand,decisions,decisiondetail,evidence,search};
function render(){document.getElementById('nav').innerHTML=Object.entries(labels).map(([k,x])=>`<button data-view="${k}" class="${S.view===k?'active':''}">${x[0]} <span>${S.lang==='fa'?x[1]:x[2]}</span></button>`).join('');document.getElementById('mobileNav').innerHTML=Object.entries(labels).map(([k,x])=>`<button data-view="${k}">${x[0]}<br>${S.lang==='fa'?x[1]:x[2]}</button>`).join('')+`<button class="lang-control" id="mobileLang" aria-label="${t('تغییر زبان','Change language')}">🌐<br>${S.lang==='fa'?'EN':'FA'}</button>`;document.querySelectorAll('#nav button,#mobileNav button[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.getElementById('mobileLang').onclick=toggleLang;document.documentElement.dir=S.lang==='fa'?'rtl':'ltr';document.documentElement.lang=S.lang;document.getElementById('main').innerHTML=(views[S.view]||home)()}
document.getElementById('lang').onclick=toggleLang;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modal').classList.contains('open'))closeModal();trap(e)});render();
</script></body></html>
