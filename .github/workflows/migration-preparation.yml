name: DECIVEXA Migration Preparation

on:
  workflow_dispatch:
  push:
    branches:
      - fix/migration-snapshot-upgrade

jobs:
  generate-migration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://decivexa:decivexa@127.0.0.1:5432/decivexa
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile evidence
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Upgrade Drizzle snapshot metadata
        run: npx drizzle-kit up
      - name: Full canonical 0003 proof with exact current schema semantics
        run: |
          set -eu
          rm -rf /tmp/decivexa-canonical-proof
          mkdir -p /tmp/decivexa-canonical-proof/schema /tmp/decivexa-canonical-proof/migrations/meta
          cp src/persistence/migrations/0000_*.sql /tmp/decivexa-canonical-proof/migrations/
          cp src/persistence/migrations/0001_*.sql /tmp/decivexa-canonical-proof/migrations/
          cp src/persistence/migrations/meta/0000_snapshot.json /tmp/decivexa-canonical-proof/migrations/meta/
          cp src/persistence/migrations/meta/0001_snapshot.json /tmp/decivexa-canonical-proof/migrations/meta/
          node - <<'NODE'
          const fs = require('fs');
          const src = JSON.parse(fs.readFileSync('src/persistence/migrations/meta/_journal.json', 'utf8'));
          src.entries = src.entries.filter(e => e.idx <= 1);
          fs.writeFileSync('/tmp/decivexa-canonical-proof/migrations/meta/_journal.json', JSON.stringify(src, null, 2) + '\n');
          NODE
          cat > /tmp/decivexa-canonical-proof/schema/identity.ts <<'EOF'
          import { pgSchema, text, timestamp, uniqueIndex } from "drizzle-orm/pg-core";
          const decivexa = pgSchema("decivexa");
          export const users = decivexa.table("users", {
            id: text("id").primaryKey(),
            email: text("email").notNull(),
            passwordHash: text("password_hash").notNull(),
            createdAt: timestamp("created_at", { withTimezone: true }).notNull(),
            updatedAt: timestamp("updated_at", { withTimezone: true }).notNull(),
          }, (table) => ({
            emailUnique: uniqueIndex("users_email_unique").on(table.email),
          }));
          EOF
          cat > /tmp/decivexa-canonical-proof/schema/workspace.ts <<'EOF'
          import { pgSchema, text, timestamp, check } from "drizzle-orm/pg-core";
          import { sql } from "drizzle-orm";
          import { users } from "./identity";
          const decivexa = pgSchema("decivexa");
          export const workspaces = decivexa.table("workspaces", {
            id: text("id").primaryKey(),
            ownerId: text("owner_id").notNull().references(() => users.id, { onDelete: "restrict" }),
            lifecycleState: text("lifecycle_state").notNull().default("active"),
            createdAt: timestamp("created_at", { withTimezone: true }).notNull(),
            updatedAt: timestamp("updated_at", { withTimezone: true }).notNull(),
          }, (table) => [
            check("workspaces_lifecycle_state_check", sql`${table.lifecycleState} in ('active', 'archived')`),
          ]);
          EOF
          cat > /tmp/decivexa-canonical-proof/drizzle.config.ts <<'EOF'
          import { defineConfig } from "drizzle-kit";
          export default defineConfig({ schema: "./schema/*.ts", out: "./migrations", dialect: "postgresql" });
          EOF
          cd /tmp/decivexa-canonical-proof
          NODE_PATH="$GITHUB_WORKSPACE/apps/api/node_modules" node "$GITHUB_WORKSPACE/apps/api/node_modules/drizzle-kit/bin.cjs" generate --config=./drizzle.config.ts
          echo '--- generated canonical SQL ---'
          find migrations -maxdepth 1 -type f -name '*.sql' -print -exec sh -c 'echo "--- $1 ---"; cat "$1"' _ {} \;
          latest=$(find migrations -maxdepth 1 -type f -name '*.sql' | sort | tail -n 1)
          echo "--- latest canonical migration: $latest ---"
          grep -q 'lifecycle_state' "$latest"
          grep -q "DEFAULT 'active'" "$latest"
          grep -q 'workspaces_lifecycle_state_check' "$latest"
          grep -q "'active', 'archived'" "$latest"
          if grep -q 'CREATE TABLE' "$latest"; then echo 'FAIL: latest migration recreates a table'; exit 1; fi
          if grep -q 'users_email_unique' "$latest"; then echo 'FAIL: latest migration unexpectedly changes authentication'; exit 1; fi
          if grep -q 'owner_id' "$latest"; then echo 'FAIL: latest migration unexpectedly changes workspace ownership'; exit 1; fi
          echo 'Canonical 0003 proof passed: latest migration is lifecycle-only.'
      - name: Generate migration against repository state (diagnostic only)
        run: |
          set +e
          npm run db:generate
          status=$?
          set -e
          echo "Repository generate exit status: $status"
          exit 0
      - name: Upload canonical proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decivexa-canonical-0003-proof
          path: |
            apps/api/src/persistence/migrations/**
            apps/api/package-lock.json
          if-no-files-found: error
