name: DECIVEXA Migration Preparation

on:
  workflow_dispatch:
  push:
    branches:
      - fix/migration-snapshot-upgrade

jobs:
  generate-migration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://decivexa:decivexa@127.0.0.1:5432/decivexa
      SRC: /home/runner/work/DECIVEXA/DECIVEXA/apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and create ephemeral lockfile
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Canonical 0002 reconstruction and real drift proof
        run: |
          set -euo pipefail
          ROOT=/tmp/decivexa-canonical-lineage
          STAGE=/tmp/decivexa-auth-stage
          rm -rf "$ROOT" "$STAGE"
          mkdir -p "$ROOT/schema" "$ROOT/migrations/meta" "$STAGE/schema" "$STAGE/migrations/meta"

          # Stage A: reproduce the post-0002 state that the historical SQL created.
          cat > "$STAGE/schema/identity.schema.ts" <<'EOF'
          import { pgSchema, text, timestamp, uniqueIndex } from "drizzle-orm/pg-core";
          const decivexa = pgSchema("decivexa");
          export const users = decivexa.table("users", {
            id: text("id").primaryKey(),
            email: text("email").notNull(),
            passwordHash: text("password_hash").notNull(),
            createdAt: timestamp("created_at", { withTimezone: true }).notNull(),
            updatedAt: timestamp("updated_at", { withTimezone: true }).notNull(),
          }, (table) => ({
            emailUnique: uniqueIndex("users_email_unique").on(table.email),
          }));
          EOF
          cat > "$STAGE/schema/workspace.schema.ts" <<'EOF'
          import { pgSchema, text, timestamp } from "drizzle-orm/pg-core";
          import { users } from "./identity.schema";
          const decivexa = pgSchema("decivexa");
          export const workspaces = decivexa.table("workspaces", {
            id: text("id").primaryKey(),
            ownerId: text("owner_id").notNull().references(() => users.id, { onDelete: "restrict" }),
            createdAt: timestamp("created_at", { withTimezone: true }).notNull(),
            updatedAt: timestamp("updated_at", { withTimezone: true }).notNull(),
          });
          EOF
          cat > "$STAGE/drizzle.config.ts" <<'EOF'
          import { defineConfig } from "drizzle-kit";
          export default defineConfig({ schema: "./schema/*.ts", out: "./migrations", dialect: "postgresql" });
          EOF
          cp "$SRC"/src/persistence/migrations/0000_*.sql "$STAGE/migrations/"
          cp "$SRC"/src/persistence/migrations/0001_*.sql "$STAGE/migrations/"
          cp "$SRC"/src/persistence/migrations/meta/0000_snapshot.json "$STAGE/migrations/meta/"
          cp "$SRC"/src/persistence/migrations/meta/0001_snapshot.json "$STAGE/migrations/meta/"
          node - <<'NODE'
          const fs = require('fs');
          const src = JSON.parse(fs.readFileSync(process.env.SRC + '/src/persistence/migrations/meta/_journal.json', 'utf8'));
          src.entries = src.entries.filter(e => e.idx <= 1);
          fs.writeFileSync('/tmp/decivexa-auth-stage/migrations/meta/_journal.json', JSON.stringify(src, null, 2) + '\n');
          NODE
          cd "$STAGE"
          NODE_PATH="$GITHUB_WORKSPACE/apps/api/node_modules" node "$GITHUB_WORKSPACE/apps/api/node_modules/drizzle-kit/bin.cjs" generate --config=./drizzle.config.ts
          CANON_SNAPSHOT="$STAGE/migrations/meta/0002_snapshot.json"
          CANON_SQL=$(find "$STAGE/migrations" -maxdepth 1 -type f -name '*.sql' | sort | tail -n 1)
          test -f "$CANON_SNAPSHOT"
          test -f "$CANON_SQL"
          node -e 'const s=require(process.argv[1]); console.log({id:s.id,prevId:s.prevId,version:s.version}); if(s.version!=="7") process.exit(1)' "$CANON_SNAPSHOT"
          grep -q 'users_email_unique' "$CANON_SQL"

          # Stage B: use the real historical SQL + canonical 0002 state + REAL current schemas.
          cp "$SRC"/src/persistence/migrations/0000_*.sql "$ROOT/migrations/"
          cp "$SRC"/src/persistence/migrations/0001_*.sql "$ROOT/migrations/"
          cp "$SRC"/src/persistence/migrations/0002_authentication_credentials.sql "$ROOT/migrations/"
          cp "$SRC"/src/persistence/migrations/meta/0000_snapshot.json "$ROOT/migrations/meta/"
          cp "$SRC"/src/persistence/migrations/meta/0001_snapshot.json "$ROOT/migrations/meta/"
          cp "$CANON_SNAPSHOT" "$ROOT/migrations/meta/0002_snapshot.json"
          cp "$STAGE/migrations/meta/_journal.json" "$ROOT/migrations/meta/"
          node - <<'NODE'
          const fs = require('fs');
          const p = '/tmp/decivexa-canonical-lineage/migrations/meta/_journal.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          const e = j.entries.find(x => x.idx === 2);
          if (!e) throw new Error('Missing canonical idx=2 journal entry');
          e.tag = '0002_authentication_credentials';
          fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          NODE
          # Preserve the real import relationship: workspace.schema.ts imports ./identity.schema.
          cp "$SRC"/src/persistence/schema/identity.schema.ts "$ROOT/schema/identity.schema.ts"
          cp "$SRC"/src/persistence/schema/workspace.schema.ts "$ROOT/schema/workspace.schema.ts"
          cat > "$ROOT/drizzle.config.ts" <<'EOF'
          import { defineConfig } from "drizzle-kit";
          export default defineConfig({ schema: "./schema/*.ts", out: "./migrations", dialect: "postgresql" });
          EOF
          cd "$ROOT"
          # Fail immediately if Drizzle itself cannot load/parse the REAL schema.
          NODE_PATH="$GITHUB_WORKSPACE/apps/api/node_modules" node "$GITHUB_WORKSPACE/apps/api/node_modules/drizzle-kit/bin.cjs" generate --config=./drizzle.config.ts
          NEXT=$(find migrations -maxdepth 1 -type f -name '*.sql' | sort | tail -n 1)
          test -n "$NEXT"
          echo '--- generated next migration ---'
          cat "$NEXT"

          # Verify that the generated migration is genuinely 0003 lifecycle-only,
          # except for explicitly reported index drift.
          grep -q 'lifecycle_state' "$NEXT"
          grep -q "DEFAULT 'active'" "$NEXT"
          grep -q 'workspaces_lifecycle_state_check' "$NEXT"
          grep -q "'active', 'archived'" "$NEXT"
          if grep -q 'CREATE TABLE' "$NEXT"; then echo 'FAIL: table recreation'; exit 1; fi
          if grep -q 'password_hash' "$NEXT" || grep -q 'ADD COLUMN "email"' "$NEXT"; then echo 'FAIL: authentication columns recreated'; exit 1; fi
          if grep -q 'owner_id' "$NEXT"; then echo 'FAIL: ownership recreated'; exit 1; fi
          if grep -q 'DROP INDEX.*users_email_unique' "$NEXT"; then
            echo 'DRIFT CONFIRMED: current identity schema omits historical users_email_unique.'
          else
            echo 'DRIFT NOT CONFIRMED: users_email_unique retained.'
          fi
          echo 'PASS: canonical 0002 reconstruction and real current-schema diff completed.'
      - name: Repository generate diagnostic only
        run: |
          set +e
          npm run db:generate
          status=$?
          set -e
          echo "Repository generate exit status: $status"
          exit 0
      - name: Upload canonical lineage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decivexa-canonical-lineage-proof
          path: |
            ${{ github.workspace }}/apps/api/src/persistence/migrations/**
            ${{ github.workspace }}/apps/api/package-lock.json
          if-no-files-found: warn
