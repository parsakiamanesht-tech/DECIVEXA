name: DECIVEXA Migration Preparation

on:
  workflow_dispatch:
  push:
    branches:
      - fix/migration-snapshot-upgrade

jobs:
  generate-migration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://decivexa:decivexa@127.0.0.1:5432/decivexa
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and create ephemeral lockfile
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Canonical 0002 snapshot then real 0002 lineage proof
        run: |
          set -eu
          ROOT=/tmp/decivexa-canonical-lineage
          STAGE=/tmp/decivexa-auth-stage
          rm -rf "$ROOT" "$STAGE"
          mkdir -p "$ROOT/schema" "$ROOT/migrations/meta" "$STAGE/schema"

          # Stage A: generate the canonical snapshot for the state immediately after 0002.
          cat > "$STAGE/schema/identity.ts" <<'EOF'
          import { pgSchema, text, timestamp, uniqueIndex } from "drizzle-orm/pg-core";
          const decivexa = pgSchema("decivexa");
          export const users = decivexa.table("users", {
            id: text("id").primaryKey(), email: text("email").notNull(), passwordHash: text("password_hash").notNull(),
            createdAt: timestamp("created_at", { withTimezone: true }).notNull(), updatedAt: timestamp("updated_at", { withTimezone: true }).notNull(),
          }, (table) => ({ emailUnique: uniqueIndex("users_email_unique").on(table.email) }));
          EOF
          cat > "$STAGE/schema/workspace.ts" <<'EOF'
          import { pgSchema, text, timestamp } from "drizzle-orm/pg-core";
          import { users } from "./identity";
          const decivexa = pgSchema("decivexa");
          export const workspaces = decivexa.table("workspaces", {
            id: text("id").primaryKey(), ownerId: text("owner_id").notNull().references(() => users.id, { onDelete: "restrict" }),
            createdAt: timestamp("created_at", { withTimezone: true }).notNull(), updatedAt: timestamp("updated_at", { withTimezone: true }).notNull(),
          });
          EOF
          cat > "$STAGE/drizzle.config.ts" <<'EOF'
          import { defineConfig } from "drizzle-kit";
          export default defineConfig({ schema: "./schema/*.ts", out: "./migrations", dialect: "postgresql" });
          EOF
          cp src/persistence/migrations/0000_*.sql "$STAGE/"
          cp src/persistence/migrations/0001_*.sql "$STAGE/"
          cp src/persistence/migrations/meta/0000_snapshot.json "$STAGE/"
          cp src/persistence/migrations/meta/0001_snapshot.json "$STAGE/"
          cp src/persistence/migrations/meta/_journal.json "$STAGE/"
          cd "$STAGE"
          NODE_PATH="$GITHUB_WORKSPACE/apps/api/node_modules" node "$GITHUB_WORKSPACE/apps/api/node_modules/drizzle-kit/bin.cjs" generate --config=./drizzle.config.ts
          CANON_SNAPSHOT="$STAGE/migrations/meta/0002_snapshot.json"
          test -f "$CANON_SNAPSHOT"
          echo '--- canonical 0002 snapshot metadata ---'
          node -e 'const s=require(process.argv[1]); console.log({id:s.id,prevId:s.prevId,version:s.version}); if(s.version!=="7") process.exit(1)' "$CANON_SNAPSHOT"

          # Stage B: verified 0000 + verified 0001 + REAL 0002 SQL + canonical 0002 snapshot.
          cp src/persistence/migrations/0000_*.sql "$ROOT/migrations/"
          cp src/persistence/migrations/0001_*.sql "$ROOT/migrations/"
          cp src/persistence/migrations/0002_authentication_credentials.sql "$ROOT/migrations/"
          cp src/persistence/migrations/meta/0000_snapshot.json "$ROOT/migrations/meta/"
          cp src/persistence/migrations/meta/0001_snapshot.json "$ROOT/migrations/meta/"
          cp "$CANON_SNAPSHOT" "$ROOT/migrations/meta/0002_snapshot.json"
          cp "$STAGE/migrations/meta/_journal.json" "$ROOT/migrations/meta/_journal.json"
          node - <<'NODE'
          const fs=require('fs');
          const p='/tmp/decivexa-canonical-lineage/migrations/meta/_journal.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          const e=j.entries.find(x=>x.idx===2);
          if(!e) throw new Error('Canonical stage did not produce journal entry idx=2');
          e.tag='0002_authentication_credentials';
          fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');
          console.log('Prepared canonical 0002 journal entry:', JSON.stringify(e));
          NODE

          cp "$STAGE/schema/identity.ts" "$ROOT/schema/identity.ts"
          cat > "$ROOT/schema/workspace.ts" <<'EOF'
          import { pgSchema, text, timestamp, check } from "drizzle-orm/pg-core";
          import { sql } from "drizzle-orm";
          import { users } from "./identity";
          const decivexa = pgSchema("decivexa");
          export const workspaces = decivexa.table("workspaces", {
            id: text("id").primaryKey(), ownerId: text("owner_id").notNull().references(() => users.id, { onDelete: "restrict" }),
            lifecycleState: text("lifecycle_state").notNull().default("active"),
            createdAt: timestamp("created_at", { withTimezone: true }).notNull(), updatedAt: timestamp("updated_at", { withTimezone: true }).notNull(),
          }, (table) => [check("workspaces_lifecycle_state_check", sql`${table.lifecycleState} in ('active', 'archived')`)]);
          EOF
          cat > "$ROOT/drizzle.config.ts" <<'EOF'
          import { defineConfig } from "drizzle-kit";
          export default defineConfig({ schema: "./schema/*.ts", out: "./migrations", dialect: "postgresql" });
          EOF

          cd "$ROOT"
          NODE_PATH="$GITHUB_WORKSPACE/apps/api/node_modules" node "$GITHUB_WORKSPACE/apps/api/node_modules/drizzle-kit/bin.cjs" generate --config=./drizzle.config.ts
          echo '--- complete canonical lineage ---'
          find migrations -maxdepth 2 -type f -print
          NEXT=$(find migrations -maxdepth 1 -type f -name '*.sql' | sort | tail -n 1)
          echo "--- generated next migration: $NEXT ---"
          cat "$NEXT"
          grep -q 'lifecycle_state' "$NEXT"
          grep -q "DEFAULT 'active'" "$NEXT"
          grep -q 'workspaces_lifecycle_state_check' "$NEXT"
          grep -q "'active', 'archived'" "$NEXT"
          if grep -q 'CREATE TABLE' "$NEXT"; then echo 'FAIL: table recreation'; exit 1; fi
          if grep -q 'users_email_unique' "$NEXT"; then echo 'FAIL: authentication index recreated'; exit 1; fi
          if grep -q 'password_hash' "$NEXT" || grep -q 'ADD COLUMN "email"' "$NEXT"; then echo 'FAIL: authentication columns recreated'; exit 1; fi
          if grep -q 'owner_id' "$NEXT"; then echo 'FAIL: ownership recreated'; exit 1; fi
          echo 'PASS: canonical 0002 snapshot + REAL 0002 SQL produces lifecycle-only next migration.'

      - name: Repository generate diagnostic only
        run: |
          set +e
          npm run db:generate
          status=$?
          set -e
          echo "Repository generate exit status: $status"
          exit 0

      - name: Upload canonical lineage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decivexa-canonical-lineage-proof
          path: |
            src/persistence/migrations/**
            package-lock.json
          if-no-files-found: error
