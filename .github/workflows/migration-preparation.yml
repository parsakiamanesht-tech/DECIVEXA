name: DECIVEXA Migration Preparation

on:
  workflow_dispatch:
  push:
    branches:
      - fix/migration-snapshot-upgrade

jobs:
  generate-migration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://decivexa:decivexa@127.0.0.1:5432/decivexa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile evidence
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Upgrade Drizzle snapshot metadata
        run: npx drizzle-kit up

      - name: Inspect snapshot metadata after upgrade
        run: |
          set -eu
          echo '--- migration metadata ---'
          find src/persistence/migrations/meta -maxdepth 1 -type f -print -exec sh -c 'echo "--- $1 ---"; cat "$1"' _ {} \;
          echo '--- migration SQL ---'
          find src/persistence/migrations -maxdepth 1 -type f -name '*.sql' -print -exec sh -c 'echo "--- $1 ---"; cat "$1"' _ {} \;

      - name: Reconstruction experiment from verified 0001 baseline
        run: |
          set -eu
          rm -rf /tmp/decivexa-reconstruction
          mkdir -p /tmp/decivexa-reconstruction/schema /tmp/decivexa-reconstruction/migrations/meta
          cp src/persistence/migrations/0000_*.sql /tmp/decivexa-reconstruction/migrations/
          cp src/persistence/migrations/0001_*.sql /tmp/decivexa-reconstruction/migrations/
          cp src/persistence/migrations/meta/0000_snapshot.json /tmp/decivexa-reconstruction/migrations/meta/
          cp src/persistence/migrations/meta/0001_snapshot.json /tmp/decivexa-reconstruction/migrations/meta/
          node - <<'NODE'
          const fs = require('fs');
          const src = JSON.parse(fs.readFileSync('src/persistence/migrations/meta/_journal.json', 'utf8'));
          src.entries = src.entries.filter(e => e.idx <= 1);
          fs.writeFileSync('/tmp/decivexa-reconstruction/migrations/meta/_journal.json', JSON.stringify(src, null, 2) + '\n');
          NODE
          cat > /tmp/decivexa-reconstruction/schema/identity.ts <<'EOF'
          import { pgSchema, text, timestamp } from "drizzle-orm/pg-core";
          const decivexa = pgSchema("decivexa");
          export const users = decivexa.table("users", {
            id: text("id").primaryKey(),
            email: text("email").notNull(),
            passwordHash: text("password_hash").notNull(),
            createdAt: timestamp("created_at", { withTimezone: true }).notNull(),
            updatedAt: timestamp("updated_at", { withTimezone: true }).notNull(),
          });
          EOF
          cat > /tmp/decivexa-reconstruction/schema/workspace.ts <<'EOF'
          import { pgSchema, text, timestamp } from "drizzle-orm/pg-core";
          import { users } from "./identity";
          const decivexa = pgSchema("decivexa");
          export const workspaces = decivexa.table("workspaces", {
            id: text("id").primaryKey(),
            ownerId: text("owner_id").notNull().references(() => users.id, { onDelete: "restrict" }),
            createdAt: timestamp("created_at", { withTimezone: true }).notNull(),
            updatedAt: timestamp("updated_at", { withTimezone: true }).notNull(),
          });
          EOF
          cat > /tmp/decivexa-reconstruction/drizzle.config.ts <<'EOF'
          import { defineConfig } from "drizzle-kit";
          export default defineConfig({
            schema: "./schema/*.ts",
            out: "./migrations",
            dialect: "postgresql",
          });
          EOF
          cd /tmp/decivexa-reconstruction
          NODE_PATH="$GITHUB_WORKSPACE/apps/api/node_modules" node "$GITHUB_WORKSPACE/apps/api/node_modules/drizzle-kit/bin.cjs" generate --config=./drizzle.config.ts
          echo '--- reconstructed migration files ---'
          find /tmp/decivexa-reconstruction/migrations -maxdepth 2 -type f -print -exec sh -c 'echo "--- $1 ---"; cat "$1"' _ {} \;

      - name: Generate migration
        run: npm run db:generate

      - name: Validate migration scope
        run: |
          set -eu
          migration_count=$(find src/persistence/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)
          if [ "$migration_count" -ne 3 ]; then
            echo "Expected exactly 3 SQL migrations (users + workspace ownership + workspace lifecycle), found $migration_count"
            find src/persistence/migrations -maxdepth 1 -type f -print
            exit 1
          fi
          latest_migration=$(find src/persistence/migrations -maxdepth 1 -type f -name '*.sql' | sort | tail -n 1)
          echo "--- latest migration: $latest_migration ---"
          cat "$latest_migration"
          grep -q 'ALTER TABLE "decivexa"."workspaces"' "$latest_migration"
          grep -q 'lifecycle_state' "$latest_migration"
          grep -q "DEFAULT 'active'" "$latest_migration"
          grep -q "'active', 'archived'" "$latest_migration"
          if grep -q 'CREATE TABLE "decivexa"."users"' "$latest_migration"; then
            echo 'Latest migration unexpectedly recreates users'
            exit 1
          fi
          if grep -q 'CREATE TABLE "decivexa"."workspaces"' "$latest_migration"; then
            echo 'Latest migration unexpectedly recreates workspaces'
            exit 1
          fi
          echo 'Migration scope validation passed.'

      - name: Show generated migration files
        run: |
          echo '--- migration files ---'
          find src/persistence/migrations -maxdepth 2 -type f -print -exec sh -c 'echo "--- $1 ---"; cat "$1"' _ {} \;

      - name: Upload migration preparation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decivexa-migration-preparation-evidence
          path: |
            apps/api/src/persistence/migrations/**
            apps/api/package-lock.json
          if-no-files-found: error
