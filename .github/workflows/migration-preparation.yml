name: DECIVEXA Migration Preparation

on:
  workflow_dispatch:

jobs:
  generate-migration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://decivexa:decivexa@127.0.0.1:5432/decivexa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile evidence
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Generate migration
        run: npm run db:generate

      - name: Show generated migration files
        run: |
          echo '--- migration files ---'
          find src/persistence/migrations -maxdepth 2 -type f -print -exec sh -c 'echo "--- $1 ---"; cat "$1"' _ {} \;

      - name: Upload migration preparation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decivexa-migration-preparation-evidence
          path: |
            apps/api/src/persistence/migrations/**
            apps/api/package-lock.json
          if-no-files-found: error
