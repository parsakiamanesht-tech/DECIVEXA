name: Drizzle Kit 0.31.4 Compatibility Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - diagnostic/drizzle-kit-0314-compatibility

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout diagnostic baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install repository dependencies
        run: npm ci
      - name: Report baseline versions
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm ls drizzle-kit drizzle-orm --depth=0
      - name: Run Drizzle Kit 0.31.4 generate in isolated workspace
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          cp -a . "$tmpdir/apps-api"
          cd "$tmpdir/apps-api"
          echo "Diagnostic workspace: $PWD"
          echo "Pinned diagnostic version: 0.31.4"
          npx --yes drizzle-kit@0.31.4 --version
          set +e
          npx --yes drizzle-kit@0.31.4 generate
          status=$?
          set -e
          echo "drizzle-kit 0.31.4 generate exit code: $status"
          echo "--- migration files after generate ---"
          find src/persistence/migrations -maxdepth 1 -type f -name '*.sql' -print | sort
          echo "--- snapshot files after generate ---"
          find src/persistence/migrations/meta -maxdepth 1 -type f -name '*_snapshot.json' -print | sort
          exit 0
      - name: Diagnostic result
        run: echo "DRIZZLE KIT 0.31.4 COMPATIBILITY DIAGNOSTIC COMPLETE"