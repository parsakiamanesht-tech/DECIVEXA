name: DECIVEXA API Verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-verification.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-verification.yml'

jobs:
  verify-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: decivexa
          POSTGRES_PASSWORD: decivexa
          POSTGRES_DB: decivexa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decivexa -d decivexa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://decivexa:decivexa@127.0.0.1:5432/decivexa
      AUTH_TOKEN_SECRET: decivexa-ci-auth-token-secret-0123456789
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile evidence
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install from generated lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Workspace access tests
        run: npm run test

      - name: Generate migration
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:migrate

      - name: Verify database connectivity and approved PostgreSQL line
        run: >-
          node -e 'const { Client } = require("pg"); const c = new Client({ connectionString: process.env.DATABASE_URL }); c.connect().then(() => c.query("select current_database() as database, current_schema() as schema, version() as version")).then(r => { console.log(JSON.stringify(r.rows[0])); if (!/^PostgreSQL 18\\./.test(r.rows[0].version)) { throw new Error(`Expected PostgreSQL 18.x, got: ${r.rows[0].version}`); } return c.end(); }).catch(e => { console.error(e); process.exit(1); });'

      - name: Build
        run: npm run build

      - name: Start application
        run: |
          node dist/main.js > /tmp/decivexa-api.log 2>&1 &
          echo $! > /tmp/decivexa-api.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /tmp/decivexa-health.json; then
              cat /tmp/decivexa-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/decivexa-api.log
          exit 1

      - name: Verify registration, login and authenticated context
        run: |
          set -euo pipefail
          EMAIL="ci-${GITHUB_RUN_ID}@example.com"
          PASSWORD="CorrectHorseBatteryStaple123!"
          REGISTER=$(curl --fail --silent --show-error -X POST http://127.0.0.1:3000/auth/register -H 'Content-Type: application/json' -d "{\"email\":\"${EMAIL}\",\"password\":\"${PASSWORD}\"}")
          echo "$REGISTER"
          TOKEN=$(node -e 'const body=JSON.parse(process.argv[1]); if(!body.accessToken) process.exit(1); process.stdout.write(body.accessToken)' "$REGISTER")

          LOGIN=$(curl --fail --silent --show-error -X POST http://127.0.0.1:3000/auth/login -H 'Content-Type: application/json' -d "{\"email\":\"${EMAIL}\",\"password\":\"${PASSWORD}\"}")
          echo "$LOGIN"
          LOGIN_TOKEN=$(node -e 'const body=JSON.parse(process.argv[1]); if(!body.accessToken) process.exit(1); process.stdout.write(body.accessToken)' "$LOGIN")
          test -n "$LOGIN_TOKEN"

          ME=$(curl --fail --silent --show-error http://127.0.0.1:3000/auth/me -H "Authorization: Bearer ${TOKEN}")
          echo "$ME"
          node -e 'const body=JSON.parse(process.argv[1]); if(!body.userId || !body.requestId) process.exit(1)' "$ME"

          DUPLICATE_STATUS=$(curl --silent --output /tmp/decivexa-duplicate.json --write-out '%{http_code}' -X POST http://127.0.0.1:3000/auth/register -H 'Content-Type: application/json' -d "{\"email\":\"${EMAIL}\",\"password\":\"${PASSWORD}\"}")
          test "$DUPLICATE_STATUS" = "409"

          WRONG_PASSWORD_STATUS=$(curl --silent --output /tmp/decivexa-wrong-password.json --write-out '%{http_code}' -X POST http://127.0.0.1:3000/auth/login -H 'Content-Type: application/json' -d "{\"email\":\"${EMAIL}\",\"password\":\"wrong-password\"}")
          test "$WRONG_PASSWORD_STATUS" = "401"

          MISSING_TOKEN_STATUS=$(curl --silent --output /tmp/decivexa-missing-token.json --write-out '%{http_code}' http://127.0.0.1:3000/auth/me)
          test "$MISSING_TOKEN_STATUS" = "401"

          TAMPERED_TOKEN_STATUS=$(curl --silent --output /tmp/decivexa-tampered-token.json --write-out '%{http_code}' http://127.0.0.1:3000/auth/me -H "Authorization: Bearer ${TOKEN}tampered")
          test "$TAMPERED_TOKEN_STATUS" = "401"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decivexa-api-verification-evidence
          path: |
            apps/api/package-lock.json
            apps/api/src/persistence/migrations/**
            /tmp/decivexa-health.json
            /tmp/decivexa-api.log
            /tmp/decivexa-duplicate.json
            /tmp/decivexa-wrong-password.json
            /tmp/decivexa-missing-token.json
            /tmp/decivexa-tampered-token.json
          if-no-files-found: warn

      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/decivexa-api.pid ]; then
            kill "$(cat /tmp/decivexa-api.pid)" || true
          fi
