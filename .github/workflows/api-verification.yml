name: API Verification

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-verification.yml"
      - "docs/IMPLEMENTATION_INCREMENT_003_CONTRACT.md"

jobs:
  verify-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: decivexa
          POSTGRES_USER: decivexa
          POSTGRES_PASSWORD: decivexa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decivexa -d decivexa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify lockfile
        run: npm install --package-lock-only --ignore-scripts
        working-directory: apps/api
      - name: Install dependencies
        run: npm ci
        working-directory: apps/api
      - name: Typecheck
        run: npm run typecheck
        working-directory: apps/api
      - name: Architecture and workspace tests
        run: npm test
        working-directory: apps/api
      - name: Generate migrations
        run: npm run db:generate
        working-directory: apps/api
      - name: Apply migrations
        run: npm run db:migrate
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://decivexa:decivexa@localhost:5432/decivexa
      - name: Verify PostgreSQL 18 and connectivity
        run: |
          psql "postgresql://decivexa:decivexa@localhost:5432/decivexa" -c 'SELECT version();'
      - name: Build
        run: npm run build
        working-directory: apps/api
      - name: Start application
        run: |
          DATABASE_URL=postgresql://decivexa:decivexa@localhost:5432/decivexa AUTH_TOKEN_SECRET="ci-only-decivexa-auth-secret-32chars" npm start > /tmp/decivexa-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health > /tmp/decivexa-health.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/decivexa-api.log
          exit 1
        working-directory: apps/api
      - name: Verify registration, login, personal state and security boundaries
        run: |
          set -euo pipefail
          EMAIL="ci-${GITHUB_RUN_ID}@example.com"
          SECOND_EMAIL="ci-second-${GITHUB_RUN_ID}@example.com"
          PASSWORD="CorrectHorseBatteryStaple123!"
          REGISTER=$(curl --fail --silent --show-error -X POST http://127.0.0.1:3000/auth/register -H 'Content-Type: application/json' -d "{\"email\":\"${EMAIL}\",\"password\":\"${PASSWORD}\"}")
          TOKEN=$(node -e 'const body=JSON.parse(process.argv[1]); if(!body.accessToken) process.exit(1); process.stdout.write(body.accessToken)' "$REGISTER")
          SECOND_REGISTER=$(curl --fail --silent --show-error -X POST http://127.0.0.1:3000/auth/register -H 'Content-Type: application/json' -d "{\"email\":\"${SECOND_EMAIL}\",\"password\":\"${PASSWORD}\"}")
          SECOND_TOKEN=$(node -e 'const body=JSON.parse(process.argv[1]); if(!body.accessToken) process.exit(1); process.stdout.write(body.accessToken)' "$SECOND_REGISTER")
          LOGIN=$(curl --fail --silent --show-error -X POST http://127.0.0.1:3000/auth/login -H 'Content-Type: application/json' -d "{\"email\":\"${EMAIL}\",\"password\":\"${PASSWORD}\"}")
          LOGIN_TOKEN=$(node -e 'const body=JSON.parse(process.argv[1]); if(!body.accessToken) process.exit(1); process.stdout.write(body.accessToken)' "$LOGIN")
          test -n "$LOGIN_TOKEN"
          ME=$(curl --fail --silent --show-error http://127.0.0.1:3000/auth/me -H "Authorization: Bearer ${TOKEN}")
          USER_ID=$(node -e 'const body=JSON.parse(process.argv[1]); if(!body.userId) process.exit(1); process.stdout.write(body.userId)' "$ME")
          test -n "$USER_ID"
          STATE=$(curl --fail --silent --show-error -X POST http://127.0.0.1:3000/personal-state -H 'Content-Type: application/json' -H "Authorization: Bearer ${TOKEN}" -d '{"timezone":"Europe/Paris","locale":"fr-FR","availability":"available"}')
          echo "$STATE"
          REVISION=$(node -e 'const body=JSON.parse(process.argv[1]); if(body.revision !== 1 || body.userId !== process.argv[2] || body.provenance !== "declared") process.exit(1); process.stdout.write(String(body.revision))' "$STATE" "$USER_ID")
          READ=$(curl --fail --silent --show-error http://127.0.0.1:3000/personal-state -H "Authorization: Bearer ${TOKEN}")
          node -e 'const body=JSON.parse(process.argv[1]); if(body.timezone !== "Europe/Paris" || body.revision !== 1 || body.provenance !== "declared") process.exit(1)' "$READ"
          UPDATED=$(curl --fail --silent --show-error -X PATCH http://127.0.0.1:3000/personal-state -H 'Content-Type: application/json' -H "Authorization: Bearer ${TOKEN}" -d '{"revision":1,"timezone":"UTC","availability":"limited"}')
          node -e 'const body=JSON.parse(process.argv[1]); if(body.timezone !== "UTC" || body.revision !== 2 || body.provenance !== "declared") process.exit(1)' "$UPDATED"
          STALE_STATUS=$(curl --silent --output /tmp/decivexa-stale-revision.json --write-out '%{http_code}' -X PATCH http://127.0.0.1:3000/personal-state -H 'Content-Type: application/json' -H "Authorization: Bearer ${TOKEN}" -d '{"revision":1,"timezone":"Europe/London"}')
          test "$STALE_STATUS" = "409"
          CROSS_USER_STATUS=$(curl --silent --output /tmp/decivexa-cross-user.json --write-out '%{http_code}' http://127.0.0.1:3000/personal-state -H "Authorization: Bearer ${SECOND_TOKEN}")
          test "$CROSS_USER_STATUS" = "404"
          MISSING_TOKEN_STATUS=$(curl --silent --output /tmp/decivexa-missing-token.json --write-out '%{http_code}' http://127.0.0.1:3000/personal-state)
          test "$MISSING_TOKEN_STATUS" = "401"
          CLIENT_OBSERVED_STATUS=$(curl --silent --output /tmp/decivexa-client-observed.json --write-out '%{http_code}' -X POST http://127.0.0.1:3000/personal-state -H 'Content-Type: application/json' -H "Authorization: Bearer ${SECOND_TOKEN}" -d '{"provenance":"observed"}')
          test "$CLIENT_OBSERVED_STATUS" = "201"
          CLIENT_OBSERVED=$(cat /tmp/decivexa-client-observed.json)
          node -e 'const body=JSON.parse(process.argv[1]); if(body.provenance !== "declared") process.exit(1)' "$CLIENT_OBSERVED"
          DUPLICATE_STATUS=$(curl --silent --output /tmp/decivexa-duplicate.json --write-out '%{http_code}' -X POST http://127.0.0.1:3000/auth/register -H 'Content-Type: application/json' -d "{\"email\":\"${EMAIL}\",\"password\":\"${PASSWORD}\"}")
          test "$DUPLICATE_STATUS" = "409"
          WRONG_PASSWORD_STATUS=$(curl --silent --output /tmp/decivexa-wrong-password.json --write-out '%{http_code}' -X POST http://127.0.0.1:3000/auth/login -H 'Content-Type: application/json' -d "{\"email\":\"${EMAIL}\",\"password\":\"wrong-password\"}")
          test "$WRONG_PASSWORD_STATUS" = "401"
          AUTH_MISSING_STATUS=$(curl --silent --output /tmp/decivexa-auth-missing-token.json --write-out '%{http_code}' http://127.0.0.1:3000/auth/me)
          test "$AUTH_MISSING_STATUS" = "401"
          TAMPERED_TOKEN_STATUS=$(curl --silent --output /tmp/decivexa-tampered-token.json --write-out '%{http_code}' http://127.0.0.1:3000/auth/me -H "Authorization: Bearer ${TOKEN}tampered")
          test "$TAMPERED_TOKEN_STATUS" = "401"
      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: decivexa-api-verification-evidence
          path: |
            apps/api/src/persistence/migrations/**
            /tmp/decivexa-health.json
            /tmp/decivexa-api.log
            /tmp/decivexa-stale-revision.json
            /tmp/decivexa-cross-user.json
            /tmp/decivexa-missing-token.json
            /tmp/decivexa-client-observed.json
            /tmp/decivexa-duplicate.json
            /tmp/decivexa-wrong-password.json
            /tmp/decivexa-auth-missing-token.json
            /tmp/decivexa-tampered-token.json
          if-no-files-found: warn
