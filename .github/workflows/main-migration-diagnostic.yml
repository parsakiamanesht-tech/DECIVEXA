name: DECIVEXA Main Migration Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'diagnostic/**'

permissions:
  contents: read

jobs:
  migration-diagnostic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify checkout is main HEAD
        working-directory: .
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          expected="$(git rev-parse origin/main)"
          actual="$(git rev-parse HEAD)"
          echo "origin/main=$expected"
          echo "HEAD=$actual"
          test "$actual" = "$expected"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Report installed Drizzle versions
        run: |
          set -euo pipefail
          echo "--- current resolved versions ---"
          npx drizzle-kit --version
          npm ls drizzle-kit drizzle-orm --depth=0

      - name: Test Drizzle Kit 0.31.4 in isolation
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          cp -a . "$tmpdir/apps-api"
          cd "$tmpdir/apps-api"
          echo "Diagnostic workspace: $PWD"
          echo "--- pinned Drizzle Kit version ---"
          npx --yes drizzle-kit@0.31.4 --version
          echo "--- pinned Drizzle Kit generate ---"
          npx --yes drizzle-kit@0.31.4 generate
          echo "--- generated migration files ---"
          find src/persistence/migrations -maxdepth 2 -type f | sort | sed -n '1,200p'

      - name: Typecheck with repository dependencies
        run: npm run typecheck

      - name: Verify repository working tree is unchanged
        working-directory: .
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --porcelain)"
